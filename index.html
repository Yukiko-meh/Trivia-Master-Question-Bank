<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>知識王出題機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄、手機優先。上方吉祥物標題 → 四步驟設定卡 → 題目卡片列 → 底部固定操作列；上台模式為全螢幕覆蓋層。 */
:root{
  --bg:#EAF5FF; --surface:#FFFFFF; --surface-2:#F4FAFF; --ink:#22324D; --muted:#5A6D8C;
  --line:#CFE2F5; --edge:#2B3C5C; --dot:#D6E9FA; --on-color:#16233B;
  --sky:#4DB0FF; --grape:#9A8AFF; --pink:#FF86AE; --sun:#FFC93C; --mint:#3CCBA0; --peach:#FF9F6B;
  --mint-soft:#D1F5E8; --sun-soft:#FFF1C2; --pink-soft:#FFE0EB;
  --font-display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A2E; --surface:#1B2644; --surface-2:#222F52; --ink:#EAF1FF; --muted:#9FB1D3;
    --line:#34466F; --edge:#6479AA; --dot:#18233D;
    --mint-soft:#15443A; --sun-soft:#4A3F17; --pink-soft:#4F2336;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A2E; --surface:#1B2644; --surface-2:#222F52; --ink:#EAF1FF; --muted:#9FB1D3;
  --line:#34466F; --edge:#6479AA; --dot:#18233D;
  --mint-soft:#15443A; --sun-soft:#4A3F17; --pink-soft:#4F2336;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 130px;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.app{max-width:760px;margin:0 auto;display:grid;gap:18px}

/* hero */
.hero{display:flex;align-items:center;gap:14px}
.mascot{flex:none;width:84px;height:84px;border:0;background:none;padding:0;border-radius:50%}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.m-body{fill:var(--sun);stroke:var(--edge);stroke-width:3.5}
.m-cap{fill:var(--edge)}
.m-eye{fill:var(--edge)}
.m-shine{fill:#fff}
.m-blush{fill:var(--pink);opacity:.8}
.m-mouth{fill:none;stroke:var(--edge);stroke-width:3.5;stroke-linecap:round}
.m-tassel{stroke:var(--pink);stroke-width:3.5;stroke-linecap:round;fill:none}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mascot:active .bob{animation:wiggle .4s}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.hero h1{font-size:clamp(30px,8vw,44px);font-weight:800;line-height:1.1;letter-spacing:.02em}
.hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.hero > div{min-width:0}

/* card */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:24px;box-shadow:0 5px 0 var(--edge);padding:16px;display:grid;gap:20px}
.step{display:grid;gap:10px}
.step-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step-h .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--on-color);border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:15px}
.step-h h2{font-size:19px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.stage-btn{
  --c:var(--sky);
  font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.2;
  min-height:44px;padding:8px 14px;border-radius:999px;
  background:var(--surface);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);
  transition:transform .08s,box-shadow .08s,background-color .15s;
}
.chip:active,.stage-btn:active,.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-color);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ ";font-size:.85em}
.stage-row{--c:var(--sky);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.stage-btn{background:var(--c);color:var(--on-color);display:grid;gap:0;text-align:center;padding:6px 12px;border-radius:16px;min-width:64px}
.stage-btn small{font-family:var(--font-body);font-size:11px;font-weight:500;opacity:.85}
.chip.type{padding-inline:16px}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper .chip.round{width:46px;padding:0;font-size:22px;display:grid;place-items:center}
.count-box{min-width:92px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}
.count-box small{font-size:15px;font-weight:600;margin-left:3px;color:var(--muted)}
.preset{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{
  font-family:var(--font-display);font-weight:800;font-size:18px;min-height:52px;padding:10px 18px;
  border-radius:18px;border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);
  background:var(--surface);color:var(--ink);transition:transform .08s,box-shadow .08s;
}
.btn.primary{background:var(--pink);color:var(--on-color)}
.btn.sun{background:var(--sun);color:var(--on-color)}
.btn.mint{background:var(--mint);color:var(--on-color)}
.btn.small{min-height:42px;font-size:15px;padding:6px 14px;border-radius:14px;box-shadow:0 3px 0 var(--edge);font-weight:700}

/* result */
.res-head{display:grid;gap:10px}
.res-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.res-title h2{font-size:24px;font-weight:800}
.meta{font-size:14px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:var(--sun-soft);border:2px dashed var(--edge);border-radius:16px;padding:8px 12px;font-size:14px}
.list{display:grid;gap:14px}
.q{--c:var(--sky);background:var(--surface);border:2px solid var(--edge);border-radius:22px;box-shadow:0 4px 0 var(--edge);padding:14px;display:grid;gap:12px}
.q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{flex:none;min-width:36px;height:36px;padding:0 8px;border-radius:12px;background:var(--c);color:var(--on-color);border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid var(--edge);background:var(--c);color:var(--on-color);white-space:nowrap}
.tag.plain{background:var(--surface-2);color:var(--ink)}
.swap{margin-left:auto;font-size:14px;font-weight:700;min-height:38px;padding:4px 12px;border-radius:12px;border:2px solid var(--edge);background:var(--surface-2);box-shadow:0 2px 0 var(--edge)}
.swap:active{transform:translateY(2px);box-shadow:none}
.q-text{margin:0;font-size:19px;font-weight:700;line-height:1.55;overflow-wrap:anywhere}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2)}
.opt b{width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--font-display);font-size:14px}
.opt span{overflow-wrap:anywhere}
.opt.correct{border-color:var(--mint);background:var(--mint-soft)}
.opt.correct b{background:var(--mint);color:var(--on-color)}
.claim{margin:0;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:2px dashed var(--line);font-weight:700;overflow-wrap:anywhere}
.tfrow{display:flex;gap:10px}
.tfrow span{flex:1;text-align:center;padding:9px;border-radius:14px;border:2px solid var(--edge);font-family:var(--font-display);font-weight:800;font-size:18px;background:var(--surface-2)}
.tfrow span.yes.hit{background:var(--mint);color:var(--on-color)}
.tfrow span.no.hit{background:var(--pink);color:var(--on-color)}
.ans{padding:10px 12px;border-radius:14px;background:var(--mint-soft);border:2px solid var(--mint);font-weight:700;overflow-wrap:anywhere}
.ans em{font-style:normal;color:var(--muted);font-weight:500;font-size:14px;display:block}
.peek{justify-self:start;font-weight:700;font-size:15px;min-height:40px;padding:4px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--sun);color:var(--on-color);box-shadow:0 3px 0 var(--edge)}
.peek:active{transform:translateY(3px);box-shadow:none}
.switch{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:4px 12px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);box-shadow:0 3px 0 var(--edge);font-weight:700;font-size:15px}
.switch i{width:38px;height:22px;border-radius:999px;border:2px solid var(--edge);background:var(--surface-2);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--edge);transition:transform .15s}
.switch[aria-pressed="true"] i{background:var(--mint)}
.switch[aria-pressed="true"] i::after{transform:translateX(16px)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;justify-content:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--bg);border-top:2px solid var(--edge)}
.dock .btn{flex:1;max-width:340px}
.dock .btn.primary{flex:2}

/* toast & sheet */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  z-index:60;max-width:min(92vw,420px);padding:10px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;text-align:center;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(10,16,30,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-box{width:min(100%,560px);max-height:100%;display:grid;gap:12px;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface);border:2px solid var(--edge);border-radius:22px;box-shadow:0 5px 0 var(--edge);padding:16px}
.sheet textarea{width:100%;min-height:220px;resize:none;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:15px;padding:10px}

/* stage (上台模式) */
.stage{position:fixed;inset:0;z-index:50;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:24px 24px;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.st-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st-top .grow{flex:1}
.st-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;justify-content:center;width:100%;max-width:900px;margin:0 auto}
.st-q{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(24px,5.6vw,46px);line-height:1.4;overflow-wrap:anywhere;text-wrap:balance}
.st-opts{display:grid;gap:10px;grid-template-columns:1fr}
.st-opts .opt{font-size:clamp(18px,3.6vw,30px);font-weight:700;padding:12px 14px;grid-template-columns:40px minmax(0,1fr)}
.st-opts .opt b{width:36px;height:36px;font-size:17px}
.st-ans{font-family:var(--font-display);font-size:clamp(20px,4vw,34px);font-weight:800;padding:14px 16px;border-radius:18px;background:var(--mint-soft);border:3px solid var(--mint);overflow-wrap:anywhere}
.st-timer{display:grid;gap:8px;width:100%;max-width:900px;margin:0 auto;background:var(--surface);border:2px solid var(--edge);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--edge)}
.t-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t-num{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.t-bar{flex:1;min-width:80px;height:16px;border-radius:999px;border:2px solid var(--edge);background:var(--surface-2);overflow:hidden}
.t-bar i{display:block;height:100%;width:100%;background:var(--mint);transition:width .2s linear,background-color .2s}
.st-timer.low .t-bar i{background:var(--sun)}
.st-timer.up .t-bar i{background:var(--pink)}
.st-timer.up .t-num{color:var(--pink);animation:flash .5s steps(2) infinite}
@keyframes flash{50%{opacity:.35}}
.st-nav{display:flex;gap:10px;width:100%;max-width:900px;margin:0 auto}
.st-nav .btn{flex:1;padding-inline:8px}

.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px}
@media (prefers-reduced-motion:reduce){
  .bob,.st-timer.up .t-num{animation:none}
  *{transition-duration:.01ms!important}
}
@media (min-width:700px){
  .st-opts{grid-template-columns:1fr 1fr}
  .hero .mascot{width:104px;height:104px}
}
</style>

<div class="app">
  <header class="hero">
    <button class="mascot" id="mascot" type="button" aria-label="小知老師">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g class="bob">
        <ellipse class="m-body" cx="50" cy="58" rx="36" ry="33"/>
        <path class="m-cap" d="M50 14 L82 28 L50 42 L18 28 Z"/>
        <path class="m-cap" d="M30 36 L30 46 Q50 56 70 46 L70 36 L50 44 Z"/>
        <path class="m-tassel" d="M82 28 L82 44"/>
        <circle cx="82" cy="46" r="4" fill="var(--pink)"/>
        <circle class="m-eye" cx="38" cy="62" r="5.5"/><circle class="m-eye" cx="62" cy="62" r="5.5"/>
        <circle class="m-shine" cx="40" cy="60" r="1.9"/><circle class="m-shine" cx="64" cy="60" r="1.9"/>
        <ellipse class="m-blush" cx="29" cy="72" rx="6" ry="4"/><ellipse class="m-blush" cx="71" cy="72" rx="6" ry="4"/>
        <path class="m-mouth" d="M43 72 Q50 80 57 72"/>
      </g></svg>
    </button>
    <div>
      <h1>知識王出題機</h1>
      <p>選好年級和科目，一鍵出題。搶答、必答、是非都行！</p>
    </div>
  </header>

  <section class="card" id="setup" aria-label="出題設定">
    <div class="step">
      <div class="step-h"><span class="n">1</span><h2>選年級</h2><span class="hint">可以多選，點左邊整排全選</span></div>
      <div id="grades" style="display:grid;gap:12px"></div>
    </div>
    <div class="step">
      <div class="step-h"><span class="n">2</span><h2>選科目</h2><span class="hint">可以多選</span></div>
      <div class="chips" id="subjects"></div>
    </div>
    <div class="step">
      <div class="step-h"><span class="n">3</span><h2>選題型</h2></div>
      <div class="chips" id="types"></div>
    </div>
    <div class="step">
      <div class="step-h"><span class="n">4</span><h2>要幾題</h2></div>
      <div class="stepper">
        <button class="chip round" id="dec" type="button" aria-label="減少一題">−</button>
        <div class="count-box" id="count" aria-live="polite">5<small>題</small></div>
        <button class="chip round" id="inc" type="button" aria-label="增加一題">＋</button>
        <div class="preset" id="preset"></div>
      </div>
    </div>
  </section>

  <section id="result" aria-label="題目" style="display:grid;gap:14px;scroll-margin-top:12px">
    <div class="res-head">
      <div class="res-title"><h2>題目</h2><span class="meta" id="meta"></span></div>
      <div class="notice" id="notice" hidden></div>
      <div class="tools">
        <button class="switch" id="showAll" type="button" aria-pressed="false"><i></i>顯示答案</button>
        <button class="btn small" id="copyQ" type="button">複製題目</button>
        <button class="btn small" id="copyA" type="button">複製含答案</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<nav class="dock" aria-label="操作">
  <button class="btn primary" id="go" type="button">🎲 出題囉！</button>
  <button class="btn sun" id="present" type="button">📺 上台</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-label="複製題目">
    <h3>長按選取全部文字，再按複製</h3>
    <textarea id="sheetText" readonly></textarea>
    <button class="btn mint" id="sheetClose" type="button">好了</button>
  </div>
</div>

<div class="stage" id="stage" hidden role="dialog" aria-label="上台模式">
  <div class="st-top">
    <span class="tag plain" id="stProg"></span>
    <span id="stTag"></span>
    <span class="grow"></span>
    <button class="btn small" id="stClose" type="button">結束</button>
  </div>
  <div class="st-body">
    <p class="st-q" id="stQ"></p>
    <div class="st-opts" id="stOpts"></div>
    <div class="st-ans" id="stAns" hidden></div>
  </div>
  <div class="st-timer" id="stTimer">
    <div class="t-row">
      <div class="t-num" id="tNum">20</div>
      <div class="t-bar"><i id="tBar"></i></div>
      <button class="btn small mint" id="tGo" type="button">開始</button>
    </div>
    <div class="t-row" id="tPreset"></div>
  </div>
  <div class="st-nav">
    <button class="btn" id="stPrev" type="button">上一題</button>
    <button class="btn sun" id="stReveal" type="button">看答案</button>
    <button class="btn primary" id="stNext" type="button">下一題</button>
  </div>
</div>

<script>
/*--DATA--*/
const GRADES=['小一','小二','小三','小四','小五','小六','國一','國二','國三','高一','高二','高三'];
const STAGES=[{n:'國小',c:'mint',r:[0,5]},{n:'國中',c:'sun',r:[6,8]},{n:'高中',c:'pink',r:[9,11]}];
const SUBJ=[
  {n:'國語',e:'📖',c:'pink'},{n:'數學',e:'🔢',c:'sky'},{n:'自然',e:'🔬',c:'mint'},
  {n:'社會',e:'🌏',c:'sun'},{n:'英語',e:'🔤',c:'grape'},{n:'趣味',e:'🎈',c:'peach'}
];
const TYPES=[{id:'choice',n:'選擇題'},{id:'tf',n:'是非題'},{id:'quick',n:'搶答題'},{id:'mix',n:'綜合'}];

const P=s=>{const f=s.split('|');return {q:f[0],a:f[1],w:f.slice(2)}};
const B=arr=>arr.map(g=>g.map(P));

function M(q,ans,o){
  o=o||{};const fmt=o.fmt||String,step=o.step||1,spread=o.spread||5;
  const a=fmt(ans),set=new Set([a]),w=[];
  (o.cand||[]).forEach(c=>{const f=fmt(c);if(w.length<3&&!set.has(f)&&!(ans>=0&&c<0)){set.add(f);w.push(f)}});
  let t=0;
  while(w.length<3&&t<300){t++;let d=ans+pick([-1,1])*R(1,spread)*step;d=Math.round(d*100)/100;if(ans>=0&&d<0)continue;const f=fmt(d);if(set.has(f))continue;set.add(f);w.push(f)}
  let k=1;while(w.length<3){const f=fmt(ans+1000*k++);if(!set.has(f)){set.add(f);w.push(f)}}
  return {q,a,w};
}

  ()=>{const n=R(4,6);return M(`${n} 個人排成一列，共有幾種排法？`,FACT[n],{spread:20,cand:[n*n,n*(n-1),FACT[n-1]]})},
  ()=>{const t=pick(TRIG);return MS(`${t[0]} = ？`,t[1],shuffle(TRIGV.filter(v=>v!==t[1])).slice(0,3))}
 ],
 [ // 高三
  ()=>{const n=R(2,5),a=R(1,4),v=n*Math.pow(a,n-1);return M(`設 f(x) = x${sup(n)}，則 f′(${a}) = ？`,v,{spread:8,cand:[Math.pow(a,n),n*Math.pow(a,n),(n-1)*Math.pow(a,n-1)]})},
  ()=>{const a=R(2,6);return M(`計算定積分：從 0 到 ${a}，對 2x 積分，結果是多少？`,a*a,{spread:6,cand:[2*a,a,2*a*a]})},
  ()=>{const k=R(2,6);return M(`連續擲 ${k} 顆公正骰子，點數總和的期望值是多少？`,3.5*k,{fmt:dec,step:.5,spread:4,cand:[3*k,3.5*(k+1),3.5*k+3]})}
 ]
];
const genMath=g=>pick(MATH[g])();
/*--UI--*/

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET='ABCD';
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

let st={grades:[3],subjects:['自然','社會'],type:'choice',count:5};
try{
  const s=JSON.parse(localStorage.getItem('quiz-setup-v1')||'null');
  if(s){
    const g=(s.grades||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<12);
    const sj=(s.subjects||[]).filter(x=>SUBJ.some(y=>y.n===x));
    if(g.length)st.grades=g;
    if(sj.length)st.subjects=sj;
    if(TYPES.some(t=>t.id===s.type))st.type=s.type;
    if(s.count>=1&&s.count<=50)st.count=Math.floor(s.count);
  }
}catch(e){}
const save=()=>{try{localStorage.setItem('quiz-setup-v1',JSON.stringify(st))}catch(e){}};

let qs=[],isSample=true,expanded=false;

/* ---------- 設定區 ---------- */
function renderSetup(){
  $('#grades').innerHTML=STAGES.map(S=>{
    const idx=[];for(let i=S.r[0];i<=S.r[1];i++)idx.push(i);
    const all=idx.every(i=>st.grades.includes(i));
    return `<div class="stage-row" style="--c:var(--${S.c})"><button class="stage-btn" type="button" data-stage="${S.n}" aria-pressed="${all}">${S.n}<small>${all?'取消全選':'全選'}</small></button><div class="chips">${idx.map(i=>`<button class="chip" type="button" data-g="${i}" aria-pressed="${st.grades.includes(i)}">${GRADES[i]}</button>`).join('')}</div></div>`;
  }).join('');
  $('#subjects').innerHTML=SUBJ.map(s=>`<button class="chip" type="button" data-s="${s.n}" style="--c:var(--${s.c})" aria-pressed="${st.subjects.includes(s.n)}">${s.e} ${s.n}</button>`).join('');
  $('#types').innerHTML=TYPES.map(t=>`<button class="chip type" type="button" data-t="${t.id}" style="--c:var(--grape)" aria-pressed="${st.type===t.id}">${t.n}</button>`).join('');
  $('#count').innerHTML=`${st.count}<small>題</small>`;
  $('#preset').innerHTML=[5,10,15,20].map(n=>`<button class="chip" type="button" data-n="${n}" style="--c:var(--sun)" aria-pressed="${st.count===n}">${n}</button>`).join('');
}
$('#grades').addEventListener('click',e=>{
  const sb=e.target.closest('[data-stage]');
  if(sb){
    const S=STAGES.find(x=>x.n===sb.dataset.stage);const idx=[];for(let i=S.r[0];i<=S.r[1];i++)idx.push(i);
    const all=idx.every(i=>st.grades.includes(i));
    st.grades=all?st.grades.filter(g=>!idx.includes(g)):[...new Set([...st.grades,...idx])];
  }else{
    const b=e.target.closest('[data-g]');if(!b)return;const g=+b.dataset.g;
    st.grades=st.grades.includes(g)?st.grades.filter(x=>x!==g):[...st.grades,g];
  }
  save();renderSetup();
});
$('#subjects').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;
  st.subjects=st.subjects.includes(s)?st.subjects.filter(x=>x!==s):[...st.subjects,s];
  save();renderSetup();
});
$('#types').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;st.type=b.dataset.t;save();renderSetup()});
$('#preset').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;st.count=+b.dataset.n;save();renderSetup()});
$('#dec').addEventListener('click',()=>{st.count=Math.max(1,st.count-1);save();renderSetup()});
$('#inc').addEventListener('click',()=>{st.count=Math.min(50,st.count+1);save();renderSetup()});

/* ---------- 出題 ---------- */
function makeQ(item,b){
  const type=st.type==='mix'?pick(['choice','choice','tf','quick']):st.type;
  const opts=shuffle([b.a,...b.w]);
  const q={s:item.s,g:item.g,q:b.q,a:b.a,opts,ci:opts.indexOf(b.a),type,reveal:false};
  if(type==='tf'){const ok=Math.random()<.5;q.tfShow=ok?b.a:pick(b.w);q.tfAns=ok}
  return q;
}
function drawQuestions(n,exclude){
  const used=new Set(exclude||[]),out=[];let maxR=0;
  const sel=[...st.grades];
  for(let r=0;r<=11&&out.length<n;r++){
    const gs=new Set();
    sel.forEach(g=>{for(let d=-r;d<=r;d++){const x=g+d;if(x>=0&&x<12)gs.add(x)}});
    const bySubj={};
    st.subjects.forEach(s=>{bySubj[s]={math:[],items:new Map()}});
    gs.forEach(g=>st.subjects.forEach(s=>{
      if(s==='數學'){bySubj[s].math.push(g);return}
      const src=s==='趣味'?FUN.filter(f=>g>=f.r[0]&&g<=f.r[1]).flatMap(f=>f.list):(BANK[s][g]||[]);
      src.forEach(x=>{if(!used.has(x.q)&&!bySubj[s].items.has(x.q))bySubj[s].items.set(x.q,{...x,g,s})});
    }));
    let guard=0;
    while(out.length<n&&guard<400){
      const live=st.subjects.filter(s=>bySubj[s].math.length||bySubj[s].items.size);
      if(!live.length)break;
      const s=pick(live),slot=bySubj[s];
      let item,b;
      if(s==='數學'){const g=pick(slot.math);item={s,g};b=genMath(g)}
      else{const keys=[...slot.items.keys()];const k=pick(keys);item=slot.items.get(k);slot.items.delete(k);b=item}
      if(used.has(b.q)){guard++;continue}
      used.add(b.q);out.push(makeQ(item,b));
      if(r>maxR)maxR=r;
    }
  }
  return {list:out,expanded:maxR>0};
}
function generate(){
  if(!st.grades.length){toast('先選至少一個年級喔');return false}
  if(!st.subjects.length){toast('先選至少一個科目喔');return false}
  const res=drawQuestions(st.count,[]);
  if(!res.list.length){toast('這個範圍找不到題目，換個科目試試');return false}
  qs=shuffle(res.list);expanded=res.expanded;isSample=false;
  $('#showAll').setAttribute('aria-pressed','false');
  renderList();return true;
}

/* ---------- 題目列表 ---------- */
const sj=n=>SUBJ.find(x=>x.n===n)||SUBJ[0];
const TYPE_N={choice:'選擇題',tf:'是非題',quick:'搶答題'};
function answerText(q){
  if(q.type==='choice')return `${LET[q.ci]}　${q.a}`;
  if(q.type==='tf')return q.tfAns?'〇 對':'✕ 錯';
  return q.a;
}
function bodyHTML(q,big){
  if(q.type==='choice')return `<ol class="opts">${q.opts.map((o,k)=>`<li class="opt${q.reveal&&k===q.ci?' correct':''}"><b>${LET[k]}</b><span>${esc(o)}</span></li>`).join('')}</ol>`;
  if(q.type==='tf')return `<p class="claim">答案是「${esc(q.tfShow)}」</p><div class="tfrow"><span class="yes${q.reveal&&q.tfAns?' hit':''}">〇 對</span><span class="no${q.reveal&&!q.tfAns?' hit':''}">✕ 錯</span></div>`;
  return '';
}
function ansHTML(q){
  let extra='';
  if(q.type==='tf'&&!q.tfAns)extra=`<em>正確答案是「${esc(q.a)}」</em>`;
  if(q.type==='choice'&&false)extra='';
  return `<div class="ans">答案：${esc(answerText(q))}${extra}</div>`;
}
function qHTML(q,i){
  const s=sj(q.s);
  return `<article class="q" data-i="${i}" style="--c:var(--${s.c})">
    <div class="q-top"><span class="num">${i+1}</span><span class="tag">${s.e} ${s.n}</span><span class="tag plain">${GRADES[q.g]}</span><span class="tag plain">${TYPE_N[q.type]}</span><button class="swap" type="button" data-act="swap" aria-label="換掉第 ${i+1} 題">換一題</button></div>
    <p class="q-text">${esc(q.q)}</p>
    ${bodyHTML(q)}
    ${q.reveal?ansHTML(q):`<button class="peek" type="button" data-act="peek">看答案</button>`}
  </article>`;
}
function gradeLabel(){
  const g=[...st.grades].sort((a,b)=>a-b);
  return g.length>4?`${g.length} 個年級`:g.map(i=>GRADES[i]).join('、');
}
function renderList(){
  $('#list').innerHTML=qs.length?qs.map(qHTML).join(''):`<div class="empty">還沒有題目，按下方「出題囉！」開始。</div>`;
  $('#meta').textContent=qs.length?`共 ${qs.length} 題｜${gradeLabel()}｜${st.subjects.join('、')}`:'';
  const n=$('#notice');
  if(isSample){n.hidden=false;n.textContent='這是範例題目。調整上面的設定，再按「出題囉！」就會換成你要的題目。'}
  else if(expanded){n.hidden=false;n.textContent='這個範圍的題庫不夠，已經從相鄰年級補上幾題。'}
  else n.hidden=true;
}
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const i=+b.closest('.q').dataset.i,q=qs[i];
  if(b.dataset.act==='peek'){q.reveal=true;renderList()}
  if(b.dataset.act==='swap'){
    const res=drawQuestions(1,qs.map(x=>x.q));
    if(!res.list.length){toast('沒有更多題目可以換囉');return}
    qs[i]=res.list[0];isSample=false;renderList();
  }
});
$('#showAll').addEventListener('click',e=>{
  const on=e.currentTarget.getAttribute('aria-pressed')!=='true';
  e.currentTarget.setAttribute('aria-pressed',String(on));
  qs.forEach(q=>q.reveal=on);renderList();
});

/* ---------- 複製 ---------- */
function buildText(withAns){
  const head=`【知識王出題機】${gradeLabel()}｜${st.subjects.join('、')}｜共 ${qs.length} 題`;
  const body=qs.map((q,i)=>{
    const tag=`（${q.s}・${GRADES[q.g]}）`;
    if(q.type==='choice')return `${i+1}. ${tag}${q.q}\n`+q.opts.map((o,k)=>`   (${LET[k]}) ${o}`).join('\n');
    if(q.type==='tf')return `${i+1}. ${tag}${q.q}\n   答案是「${q.tfShow}」，對還是錯？（　）`;
    return `${i+1}. ${tag}搶答：${q.q}`;
  }).join('\n\n');
  let t=head+'\n\n'+body;
  if(withAns)t+='\n\n──── 答案 ────\n'+qs.map((q,i)=>{
    if(q.type==='tf')return `${i+1}. ${q.tfAns?'〇 對':'✕ 錯'}${q.tfAns?'':`（正確答案：${q.a}）`}`;
    return `${i+1}. ${answerText(q)}`;
  }).join('\n');
  return t;
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('已複製，貼到 LINE 或文件就能用！')}
  catch(e){$('#sheetText').value=t;$('#sheet').hidden=false;const ta=$('#sheetText');ta.focus();ta.select()}
}
$('#copyQ').addEventListener('click',()=>qs.length&&copyText(buildText(false)));
$('#copyA').addEventListener('click',()=>qs.length&&copyText(buildText(true)));
$('#sheetClose').addEventListener('click',()=>{$('#sheet').hidden=true});

/* ---------- 提示 ---------- */
let toastH;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastH);toastH=setTimeout(()=>t.classList.remove('on'),2200)}
const CHEER=['今天要考倒誰呢？','出題我最行！','小朋友們準備好了嗎？','答對的人有掌聲！','加油，你是知識王！','來一題腦力激盪吧！'];
$('#mascot').addEventListener('click',()=>toast(pick(CHEER)));

/* ---------- 上台模式 ---------- */
let si=0;
const tm={sec:20,left:20,run:false,end:0,h:null};
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();c.close()},500)}catch(e){}}
function paintTimer(){
  const s=Math.ceil(tm.left);
  $('#tNum').textContent=s;
  $('#tBar').style.width=(tm.sec?Math.max(0,tm.left/tm.sec)*100:0)+'%';
  const box=$('#stTimer');
  box.classList.toggle('low',tm.left>0&&tm.left<=5);
  box.classList.toggle('up',tm.left<=0);
  $('#tGo').textContent=tm.run?'暫停':(tm.left<=0?'再來一次':(tm.left<tm.sec?'繼續':'開始'));
  $('#tPreset').innerHTML=[10,20,30,60].map(n=>`<button class="chip" type="button" data-sec="${n}" style="--c:var(--sky);min-height:38px;padding:4px 12px;font-size:15px" aria-pressed="${tm.sec===n}">${n} 秒</button>`).join('');
}
function tmReset(){clearInterval(tm.h);tm.run=false;tm.left=tm.sec;paintTimer()}
function tick(){
  const l=(tm.end-Date.now())/1000;tm.left=Math.max(0,l);
  if(l<=0){clearInterval(tm.h);tm.run=false;beep()}
  paintTimer();
}
function tmToggle(){
  if(tm.run){clearInterval(tm.h);tm.run=false}
  else{if(tm.left<=0)tm.left=tm.sec;tm.end=Date.now()+tm.left*1000;tm.run=true;tm.h=setInterval(tick,200)}
  paintTimer();
}
$('#tGo').addEventListener('click',tmToggle);
$('#tPreset').addEventListener('click',e=>{const b=e.target.closest('[data-sec]');if(!b)return;tm.sec=+b.dataset.sec;tmReset()});

function renderStage(){
  const q=qs[si];if(!q)return;
  const s=sj(q.s);
  $('#stProg').textContent=`第 ${si+1} / ${qs.length} 題`;
  $('#stTag').innerHTML=`<span class="tag" style="--c:var(--${s.c})">${s.e} ${s.n}・${GRADES[q.g]}・${TYPE_N[q.type]}</span>`;
  $('#stQ').textContent=q.type==='quick'?`【搶答】${q.q}`:q.q;
  let body='';
  if(q.type==='choice')body=q.opts.map((o,k)=>`<div class="opt${q.reveal&&k===q.ci?' correct':''}"><b>${LET[k]}</b><span>${esc(o)}</span></div>`).join('');
  if(q.type==='tf')body=`<p class="claim" style="font-size:clamp(18px,3.6vw,30px)">答案是「${esc(q.tfShow)}」</p><div class="tfrow" style="font-size:clamp(18px,3.6vw,30px)"><span class="yes${q.reveal&&q.tfAns?' hit':''}">〇 對</span><span class="no${q.reveal&&!q.tfAns?' hit':''}">✕ 錯</span></div>`;
  $('#stOpts').innerHTML=body;
  const a=$('#stAns');
  a.hidden=!q.reveal;
  a.textContent='答案：'+answerText(q)+(q.type==='tf'&&!q.tfAns?`（正確答案：${q.a}）`:'');
  $('#stReveal').textContent=q.reveal?'藏起答案':'看答案';
  $('#stPrev').disabled=si===0;$('#stPrev').style.opacity=si===0?.45:1;
  $('#stNext').textContent=si===qs.length-1?'最後一題':'下一題';
  $('#stNext').disabled=si===qs.length-1;$('#stNext').style.opacity=si===qs.length-1?.45:1;
  tmReset();
}
function openStage(){
  if(!qs.length){toast('先出題才能上台喔');return}
  si=0;qs.forEach(q=>q.reveal=false);
  $('#stage').hidden=false;document.body.style.overflow='hidden';renderStage();
}
function closeStage(){clearInterval(tm.h);tm.run=false;$('#stage').hidden=true;document.body.style.overflow='';renderList()}
$('#present').addEventListener('click',openStage);
$('#stClose').addEventListener('click',closeStage);
$('#stPrev').addEventListener('click',()=>{if(si>0){si--;renderStage()}});
$('#stNext').addEventListener('click',()=>{if(si<qs.length-1){si++;renderStage()}});
$('#stReveal').addEventListener('click',()=>{qs[si].reveal=!qs[si].reveal;renderStage()});
document.addEventListener('keydown',e=>{
  if($('#stage').hidden)return;
  if(e.key==='ArrowRight')$('#stNext').click();
  else if(e.key==='ArrowLeft')$('#stPrev').click();
  else if(e.key==='Escape')closeStage();
  else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();$('#stReveal').click()}
});

/* ---------- 啟動 ---------- */
$('#go').addEventListener('click',()=>{
  if(generate()){$('#result').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});toast(`出好 ${qs.length} 題了！`)}
});
renderSetup();
{const res=drawQuestions(st.count,[]);qs=shuffle(res.list);expanded=res.expanded;renderList()}
</script>

</body></html>
