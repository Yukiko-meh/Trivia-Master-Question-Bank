<style>
/* 版面:手機單欄卡片流,底部固定大按鈕;電腦置中最寬 760px。 */
:root{
  --bg:#e9f5ff; --bg2:#d6ecff; --card:#ffffff; --ink:#2b3150; --muted:#6b7399;
  --pink:#ff6f9c; --pink-ink:#ffffff; --sun:#ffd25e; --mint:#35d0a0; --grape:#7a6cff;
  --line:#cfe2f5; --ok:#1fb383; --ok-bg:#d9f7ec; --bad:#ff6b6b;
  --shadow:0 4px 0 rgba(43,49,80,.12);
  --font:'Huninn','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171a33; --bg2:#20254a; --card:#262b52; --ink:#f1f3ff; --muted:#a6acd6;
  --pink:#ff7fa8; --sun:#ffd25e; --mint:#3fd9ab; --grape:#9a8dff; --line:#3a4177;
  --ok:#3fd9ab; --ok-bg:#1d4a4a; --bad:#ff8585; --shadow:0 4px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a33; --bg2:#20254a; --card:#262b52; --ink:#f1f3ff; --muted:#a6acd6;
  --pink:#ff7fa8; --sun:#ffd25e; --mint:#3fd9ab; --grape:#9a8dff; --line:#3a4177;
  --ok:#3fd9ab; --ok-bg:#1d4a4a; --bad:#ff8585; --shadow:0 4px 0 rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 120px;
  background-image:radial-gradient(var(--bg2) 2px,transparent 2px);background-size:26px 26px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
header.top{display:flex;align-items:center;gap:12px}
.mascot{width:68px;height:68px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
h1{margin:0;font-size:1.7rem;line-height:1.15;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:#2b3150;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:44px;font-size:1rem;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--grape);border-color:var(--grape);color:#fff;box-shadow:var(--shadow)}
.chip.sub-on[aria-pressed="true"]{background:var(--pink);border-color:var(--pink)}
.group-label{font-size:.85rem;color:var(--muted);margin:8px 0 6px;letter-spacing:.08em}
.group-label:first-of-type{margin-top:0}
.count{display:flex;align-items:center;gap:14px;justify-content:center}
.count button{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--sun);color:#2b3150;font-size:1.6rem;box-shadow:var(--shadow)}
.count output{font-size:2.2rem;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0;text-align:center}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;z-index:5}
.big{width:100%;max-width:760px;border:0;border-radius:20px;padding:15px 20px;font-size:1.25rem;background:var(--pink);color:var(--pink-ink);box-shadow:0 5px 0 rgba(160,40,90,.35)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(160,40,90,.35)}
.big:disabled{opacity:.5}
.btn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 14px;min-height:44px;font-size:.95rem;box-shadow:var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#12332a}
.btn.grape{background:var(--grape);border-color:var(--grape);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;padding:8px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.toolbar .btn{flex:1 1 auto}
.q{display:flex;flex-direction:column;gap:10px}
.q .head{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:12px;background:var(--sun);color:#2b3150;display:grid;place-items:center;font-size:1rem}
.q .text{margin:0;font-size:1.1rem;min-width:0;overflow-wrap:anywhere;flex:1}
.tag{font-size:.75rem;background:var(--bg2);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin:0;padding:0;list-style:none}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-height:44px;background:var(--bg);min-width:0}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt span{overflow-wrap:anywhere;min-width:0}
.show-ans .opt.right{background:var(--ok-bg);border-color:var(--ok)}
.show-ans .opt.right b{background:var(--ok);border-color:var(--ok);color:#fff}
.q .acts{display:flex;gap:8px;flex-wrap:wrap}
.q .acts .btn{padding:6px 12px;min-height:40px;font-size:.88rem}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
/* 上台模式 */
.stage{position:fixed;inset:0;z-index:20;background:var(--bg);background-image:radial-gradient(var(--bg2) 2px,transparent 2px);background-size:26px 26px;
  display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.stage .bar{display:flex;align-items:center;gap:10px}
.stage .bar .grow{flex:1;height:12px;border-radius:99px;background:var(--bg2);overflow:hidden}
.stage .bar .fill{height:100%;background:var(--mint);width:0;transition:width .3s}
.stage .qbox{margin:0 auto;width:100%;max-width:900px;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.stage .qtext{font-size:clamp(1.4rem,5.4vw,2.6rem);line-height:1.35;text-align:center;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.stage .opts{grid-template-columns:1fr}
@media(min-width:640px){.stage .opts{grid-template-columns:1fr 1fr}}
.stage .opt{font-size:clamp(1.1rem,3.6vw,1.7rem);padding:12px 16px;border-radius:18px}
.stage .opt b{width:36px;height:36px;font-size:1.1rem}
.timer{border:0;font-size:2rem;font-variant-numeric:tabular-nums;min-width:3ch;text-align:center;background:var(--sun);color:#2b3150;border-radius:16px;padding:2px 12px;box-shadow:var(--shadow)}
.timer.low{background:var(--bad);color:#fff;animation:shake .4s infinite}
@keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.teams{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.team{flex:1 1 120px;max-width:200px;border-radius:18px;background:var(--card);border:2px solid var(--line);padding:6px 8px;text-align:center;box-shadow:var(--shadow)}
.team .nm{font-size:.85rem;color:var(--muted)}
.team .sc{font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.team .pm{display:flex;gap:6px;justify-content:center;margin-top:4px}
.team .pm button{width:44px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.2rem}
.team:nth-child(1){border-color:var(--pink)}.team:nth-child(2){border-color:var(--grape)}.team:nth-child(3){border-color:var(--mint)}.team:nth-child(4){border-color:var(--sun)}
.stage .nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stage .nav .btn{flex:1 1 90px;max-width:200px}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.foot{text-align:center;color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="wrap" id="app">
  <header class="top">

      <path d="M40 8v6" stroke="#35d0a0" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="7" r="4" fill="#35d0a0"/>
    </svg>
    <div>
      <h1>出題小寶盒</h1>
      <p class="sub">選好年級和科目,按一下就出好題!</p>
    </div>
  </header>

  <section id="v-setup" class="wrap" style="gap:16px">
    <div class="card">
      <h2><span class="step">1</span>選年級(可以多選)</h2>
      <div class="group-label">國小</div>
      <div class="chips" id="g-elem"></div>
      <div class="group-label">國中</div>
      <div class="chips" id="g-jr"></div>
    </div>
    <div class="card">
      <h2><span class="step">2</span>選科目(可以多選)</h2>
      <div class="chips" id="subjects"></div>
    </div>
    <div class="card">
      <h2><span class="step">3</span>要幾題?</h2>
      <div class="count">
        <button id="minus" aria-label="減少題數">−</button>
        <output id="n" aria-live="polite">10</output>
        <button id="plus" aria-label="增加題數">+</button>
      </div>
      <div class="chips" id="quickn" style="justify-content:center;margin-top:10px"></div>
      <p class="hint" id="poolhint"></p>
    </div>
    <div class="card">
      <h2><span class="step">4</span>上台模式要分幾隊計分?</h2>
      <div class="chips" id="teamsel"></div>
    </div>
  </section>

  <section id="v-list" class="wrap" hidden style="gap:12px">
    <div class="toolbar">
      <button class="btn" id="back">← 重選</button>
      <button class="btn" id="toggleAns">顯示答案</button>
      <button class="btn" id="copy">複製題目</button>
      <button class="btn grape" id="play">🎤 上台模式</button>
    </div>
    <div id="list" class="wrap" style="gap:12px"></div>
  </section>

  <p class="foot">題目為隨機出題,上台前請老師再看一次喔。</p>
</div>

<div class="dock" id="dock"><button class="big" id="go">✨ 出題囉!</button></div>

<div class="stage" id="stage" hidden>
  <div class="bar">
    <button class="btn" id="st-close" aria-label="離開上台模式">✕</button>
    <div class="grow" aria-hidden="true"><div class="fill" id="st-fill"></div></div>
    <span id="st-pos" class="tag" style="font-size:.95rem"></span>
    <button class="timer" id="timer" aria-label="倒數計時,點一下換秒數">20</button>
  </div>
  <div class="qbox" id="st-q"></div>
  <div class="teams" id="teams"></div>
  <div class="nav">
    <button class="btn" id="st-prev">← 上一題</button>
    <button class="btn" id="st-time">⏱ 計時</button>
    <button class="btn primary" id="st-ans">看答案</button>
    <button class="btn" id="st-next">下一題 →</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[R(0,a.length-1)];
const SH=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const frac=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
// 用 ans 附近的數字當錯誤選項
function near(ans,deltas,fmt){
  fmt=fmt||(x=>String(x));const s=new Set([fmt(ans)]);const w=[];
  for(const d of SH(deltas)){const v=fmt(+(ans+d).toFixed(4));if(!s.has(v)){s.add(v);w.push(v)}if(w.length>=3)break}
  let k=1;while(w.length<3){const v=fmt(ans+k*7);if(!s.has(v)){s.add(v);w.push(v)}k++}
  return w;
}

      ()=>{const a=R(2,9);return{q:`比 ${a} 多 1 的數字是?`,a:String(a+1),w:near(a+1,[-2,-1,1,2])}}];

      ()=>{const a=R(50,99),b=R(11,49),s=a-b;return{q:`${a} − ${b} = ?`,a:String(s),w:near(s,[-10,-1,1,10,2])}},
      ()=>{const a=R(2,5),b=R(2,9),s=a*b;return{q:`${a} × ${b} = ?`,a:String(s),w:near(s,[-a,a,-b,b,1])}}];
M[3]=[()=>{const a=R(2,9),b=R(2,9),s=a*b;return{q:`${a} × ${b} = ?`,a:String(s),w:near(s,[-a,a,-b,b,1,-1])}},
      ()=>{const a=R(2,9),b=R(2,9),s=a*b;return{q:`${s} ÷ ${a} = ?`,a:String(b),w:near(b,[-2,-1,1,2,3])}},
      ()=>{const a=R(120,480),b=R(120,450),s=a+b;return{q:`${a} + ${b} = ?`,a:String(s),w:near(s,[-100,-10,10,100,1])}}];
M[4]=[()=>{const a=R(12,49),b=R(3,9),s=a*b;return{q:`${a} × ${b} = ?`,a:String(s),w:near(s,[-10,10,-b,b,-20,20])}},
      ()=>{const a=R(3,15),b=R(2,9),s=a*b;return{q:`${s} ÷ ${b} = ?`,a:String(a),w:near(a,[-2,-1,1,2,10])}},
      ()=>{const a=R(5,20),b=R(3,12),s=(a+b)*2;return{q:`長方形的長是 ${a} 公分,寬是 ${b} 公分,周長是幾公分?`,a:String(s),w:near(s,[-(a+b),a*b-s,-2,2,a+b])}}];
M[5]=[()=>{const a=R(11,59)/10,b=R(11,39)/10,s=+(a+b).toFixed(1);return{q:`${a.toFixed(1)} + ${b.toFixed(1)} = ?`,a:s.toFixed(1),w:near(s,[-1,-.1,.1,1,.2],x=>x.toFixed(1))}},
      ()=>{const b=P([4,6,8,10,12]),h=R(3,9),s=b*h/2;return{q:`三角形的底是 ${b} 公分,高是 ${h} 公分,面積是幾平方公分?`,a:String(s),w:near(s,[-b/2,b/2,s,-1,1])}},
      ()=>{const d=R(5,10),x=R(1,3),y=R(1,d-x-1);const n=x+y;return{q:`${x}/${d} + ${y}/${d} = ?`,a:`${n}/${d}`,w:near(n,[1,-1,2,3],v=>`${v}/${d}`).filter(v=>v!==`${n}/${d}`)}},
      ()=>{const a=R(2,9)*10,p=P([10,20,25,50]),s=a*p/100;return{q:`${a} 的 ${p}% 是多少?`,a:String(s),w:near(s,[-5,5,-1,1,10,-10],x=>String(x))}}];
M[6]=[()=>{const r=R(2,10),s=+(3.14*r*r).toFixed(2);return{q:`半徑 ${r} 公分的圓,面積是幾平方公分?(π取3.14)`,a:String(s),w:[String(+(3.14*2*r).toFixed(2)),String(+(3.14*r).toFixed(2)),String(+(3.14*r*r*2).toFixed(2))]}},
      ()=>{const v=P([40,50,60,80]),t=R(2,5),s=v*t;return{q:`時速 ${v} 公里的車子,開了 ${t} 小時,共走幾公里?`,a:String(s),w:near(s,[-v,v,-10,10,2*v])}},
      ()=>{const a=R(2,5),b=R(2,5)+a,k=R(2,5);return{q:`${a} : ${b} = ${a*k} : ?`,a:String(b*k),w:near(b*k,[-k,k,-1,1,2])}},
      ()=>{const a=R(2,9)*10,p=P([10,20,25,30,40,50]),s=a*p/100;return{q:`一件商品 ${a} 元,打 ${p}% 的折扣是便宜幾元?(直接算 ${p}%)`,a:String(s),w:near(s,[-5,5,-1,1,10])}}];
M[7]=[()=>{const a=R(2,15),b=R(2,15);return{q:`(−${a}) + ${b} = ?`,a:String(b-a),w:near(b-a,[-2,-1,1,2,a+b])}},
      ()=>{const a=R(2,12),b=R(2,12),s=-a*b;return{q:`(−${a}) × ${b} = ?`,a:String(s),w:near(s,[2*a*b,a*b,-a,a,1])}},
      ()=>{const x=R(2,12),a=R(2,15);return{q:`x + ${a} = ${x+a},x = ?`,a:String(x),w:near(x,[-a,a,-1,1,2])}},
      ()=>{const x=R(2,9),k=R(2,5),a=R(1,9);return{q:`${k}x − ${a} = ${k*x-a},x = ?`,a:String(x),w:near(x,[-1,1,2,-2,3])}}];
M[8]=[()=>{const t=P([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]);return{q:`直角三角形兩股長 ${t[0]} 和 ${t[1]},斜邊長是多少?`,a:String(t[2]),w:near(t[2],[-2,-1,1,2,t[0]+t[1]-t[2]])}},
      ()=>{const a=R(1,9),d=R(2,6),n=R(5,10),s=a+(n-1)*d;return{q:`等差數列首項 ${a}、公差 ${d},第 ${n} 項是多少?`,a:String(s),w:near(s,[-d,d,n*d-s+a,-2*d,2*d])}},
      ()=>{const k=R(3,15);return{q:`√${k*k} = ?(取正數)`,a:String(k),w:near(k,[-2,-1,1,2,k])}},
      ()=>{const a=R(2,9);return{q:`(x + ${a})(x − ${a}) 展開後是?`,a:`x² − ${a*a}`,w:[`x² + ${a*a}`,`x² − ${2*a}x`,`x² − ${a}`]}}];
M[9]=[()=>{const p=R(1,5),q=R(p+1,9);return{q:`x² − ${p+q}x + ${p*q} = 0 的兩根是?`,a:`${p} 和 ${q}`,w:[`${-p} 和 ${-q}`,`${p} 和 ${-q}`,`${p+1} 和 ${q+1}`]}},
      ()=>{const a=R(2,6);let b=R(2,6);if(b===a)b=a+1;const n=a+b;return{q:`袋中有 ${a} 顆紅球、${b} 顆白球,任取一球是紅球的機率是?`,a:frac(a,n),w:[frac(b,n),`${n}/${a}`,`1/${n}`]}},
      ()=>{const n=R(5,10),s=(n-2)*180;return{q:`${n} 邊形的內角和是幾度?`,a:String(s),w:near(s,[-180,180,360,-360,90])}},
      ()=>{const a=R(2,6),b=R(2,6);return{q:`(${a}x + ${b})(x + 1) 展開後,x 的係數是?`,a:String(a+b),w:near(a+b,[-1,1,a,b,2])}}];
function mathQ(grade){
  const g=P(M[grade])();let w=[...new Set(g.w)].filter(v=>v!==g.a);
  while(w.length<3)w.push(String(R(2,99)));
  return{grade,subject:'數學',q:g.q,opts:SH([g.a,...w.slice(0,3)]),ans:null,correct:g.a};
}
// ===== 出題小寶盒 主程式 =====
const GL=['','小一','小二','小三','小四','小五','小六','國一','國二','國三'];
const SUBJ=[['國語','📖','國語文'],['數學','🔢','數學'],['自然','🔬','自然'],['社會','🌏','社會'],['英語','🔤','英語'],['趣味','🎈','趣味常識']];
const LET='ABCD';
const $=id=>document.getElementById(id);
const st={grades:new Set([3]),subs:new Set(['國語','數學','自然']),n:10,teams:2,qs:[],showAns:false};
try{const s=JSON.parse(localStorage.getItem('qbox')||'null');if(s){st.grades=new Set(s.grades);st.subs=new Set(s.subs);st.n=s.n;st.teams=s.teams}}catch(e){}
const save=()=>{try{localStorage.setItem('qbox',JSON.stringify({grades:[...st.grades],subs:[...st.subs],n:st.n,teams:st.teams}))}catch(e){}};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

// 題庫轉成題目物件
function fromBank(grade,subject,raw){
  const p=raw.split('|');const correct=p[1];
  return{grade,subject,q:p[0],opts:SH(p.slice(1)),correct,key:grade+subject+p[0]};
}
function bankPool(grades,subs){
  const out=[];
  for(const g of grades)for(const s of subs){if(s==='數學')continue;((BANK[g]||{})[s]||[]).forEach(r=>out.push(fromBank(g,s,r)))}
  return out;
}
function makeSet(n,grades,subs){
  grades=[...grades];subs=[...subs];
  const hasMath=subs.includes('數學');
  const pool=SH(bankPool(grades,subs));
  const nm=hasMath?Math.min(n,Math.round(n/subs.length)):0;
  const res=[];const seen=new Set();
  // 先放數學題,再平均從題庫抽
  const add=q=>{const k=q.key||q.grade+q.q;if(seen.has(k))return false;seen.add(k);res.push(q);return true};
  let tries=0;while(res.length<nm&&tries++<200)add(mathQ(P(grades)));
  // 題庫:各科輪流抽,避免單科太多
  const bySub={};pool.forEach(q=>(bySub[q.subject]=bySub[q.subject]||[]).push(q));
  const keys=SH(Object.keys(bySub));
  let go=true;while(res.length<n&&go){go=false;for(const k of keys){if(res.length>=n)break;const q=bySub[k].pop();if(q){add(q);go=true}}}
  tries=0;while(hasMath&&res.length<n&&tries++<400)add(mathQ(P(grades)));
  return SH(res);
}
function replaceOne(i){
  const old=st.qs[i];const have=new Set(st.qs.map(q=>q.key||q.grade+q.q));
  let c;
  if(old.subject==='數學'){for(let t=0;t<50;t++){c=mathQ(P([...st.grades]));if(!have.has(c.grade+c.q))break;c=null}}
  else{const pool=SH(bankPool([...st.grades],[...st.subs]).filter(q=>!have.has(q.key)));
    c=pool.find(q=>q.subject===old.subject)||pool[0]||null}
  if(!c&&st.subs.has('數學'))c=mathQ(P([...st.grades]));
  if(!c){toast('這個範圍沒有更多題目了');return}
  st.qs[i]=c;renderList();toast('換好了');
}

// ===== 設定畫面 =====
function chips(el,items,isOn,onTap,cls){
  el.innerHTML='';
  items.forEach(it=>{const b=document.createElement('button');b.className='chip '+(cls||'');b.type='button';
    b.innerHTML=it.label;b.setAttribute('aria-pressed',isOn(it.v));
    b.onclick=()=>{onTap(it.v);save();renderSetup()};el.appendChild(b)});
}
function tog(set,v){set.has(v)?set.delete(v):set.add(v)}
function renderSetup(){
  chips($('g-elem'),[1,2,3,4,5,6].map(v=>({v,label:GL[v]})),v=>st.grades.has(v),v=>tog(st.grades,v));
  chips($('g-jr'),[7,8,9].map(v=>({v,label:GL[v]})),v=>st.grades.has(v),v=>tog(st.grades,v));
  chips($('subjects'),SUBJ.map(s=>({v:s[0],label:s[1]+' '+s[2]})),v=>st.subs.has(v),v=>tog(st.subs,v),'sub-on');
  chips($('quickn'),[5,10,15,20,30].map(v=>({v,label:v+'題'})),v=>st.n===v,v=>{st.n=v});
  chips($('teamsel'),[0,2,3,4].map(v=>({v,label:v?v+' 隊':'不計分'})),v=>st.teams===v,v=>{st.teams=v});
  $('n').textContent=st.n;
  const bank=bankPool([...st.grades],[...st.subs]).length,m=st.subs.has('數學');
  let h=!st.grades.size?'請先選年級':!st.subs.size?'請先選科目':
    (m?`數學題每次都會變出新題;其他科題庫目前有 ${bank} 題`:`目前這個範圍有 ${bank} 題可以抽`);
  if(st.grades.size&&st.subs.size&&!m&&bank<st.n)h+=`(不足 ${st.n} 題,會出 ${bank} 題)`;
  $('poolhint').textContent=h;
  $('go').disabled=!(st.grades.size&&st.subs.size&&(m||bank));
}
$('minus').onclick=()=>{st.n=Math.max(1,st.n-1);save();renderSetup()};
$('plus').onclick=()=>{st.n=Math.min(30,st.n+1);save();renderSetup()};

// ===== 題目清單 =====
function show(view){
  $('v-setup').hidden=view!=='setup';$('v-list').hidden=view!=='list';$('dock').hidden=view!=='setup';
  window.scrollTo(0,0);
}
$('go').onclick=()=>{st.qs=makeSet(st.n,st.grades,st.subs);st.showAns=false;renderList();show('list')};
$('back').onclick=()=>show('setup');
$('toggleAns').onclick=()=>{st.showAns=!st.showAns;renderList()};
function renderList(){
  const L=$('list');L.classList.toggle('show-ans',st.showAns);
  $('toggleAns').textContent=st.showAns?'隱藏答案':'顯示答案';
  if(!st.qs.length){L.innerHTML='<div class="empty">沒有題目,請回上一頁重選。</div>';return}
  L.innerHTML='';
  st.qs.forEach((q,i)=>{
    const c=document.createElement('article');c.className='card q pop';
    c.innerHTML=`<div class="head"><span class="num">${i+1}</span><p class="text"></p></div>
      <div class="tags"><span class="tag">${GL[q.grade]}</span><span class="tag">${(SUBJ.find(s=>s[0]===q.subject)||[])[2]||q.subject}</span></div>
      <ul class="opts"></ul>
      <div class="acts"><button class="btn" data-a="re">🔄 換一題</button><button class="btn" data-a="del">🗑 刪除</button></div>`;
    c.querySelector('.text').textContent=q.q;
    const ul=c.querySelector('.opts');
    q.opts.forEach((o,k)=>{const li=document.createElement('li');li.className='opt'+(o===q.correct?' right':'');
      li.innerHTML=`<b>${LET[k]}</b><span></span>`;li.querySelector('span').textContent=o;ul.appendChild(li)});
    c.querySelector('[data-a=re]').onclick=()=>replaceOne(i);
    c.querySelector('[data-a=del]').onclick=()=>{st.qs.splice(i,1);renderList()};
    L.appendChild(c);
  });
}
function asText(){
  const ans=[];
  const body=st.qs.map((q,i)=>{ans.push(`${i+1}.${LET[q.opts.indexOf(q.correct)]}`);
    return `${i+1}. ${q.q}\n`+q.opts.map((o,k)=>`  (${LET[k]}) ${o}`).join('\n')}).join('\n\n');
  return body+'\n\n答案:'+ans.join('  ');
}
$('copy').onclick=async()=>{
  const t=asText();
  try{await navigator.clipboard.writeText(t);toast('已複製題目和答案')}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();toast(ok?'已複製題目和答案':'複製失敗,請長按題目手動複製')}
};

// ===== 上台模式 =====
const S={i:0,rev:false,sec:20,left:0,tm:null,score:[0,0,0,0]};
const TN=['紅隊','藍隊','綠隊','黃隊'],SECS=[10,20,30,60];
function stopTimer(){clearInterval(S.tm);S.tm=null;$('timer').classList.remove('low')}
function setTimer(){$('timer').textContent=S.tm?S.left:S.sec}
function renderStage(){
  const q=st.qs[S.i];if(!q)return;
  stopTimer();setTimer();
  $('st-pos').textContent=`${S.i+1} / ${st.qs.length}`;
  $('st-fill').style.width=((S.i+1)/st.qs.length*100)+'%';
  const b=$('st-q');b.classList.toggle('show-ans',S.rev);
  b.innerHTML=`<p class="qtext"></p><ul class="opts"></ul>`;
  b.querySelector('.qtext').textContent=q.q;
  const ul=b.querySelector('.opts');
  q.opts.forEach((o,k)=>{const li=document.createElement('li');li.className='opt'+(o===q.correct?' right':'');
    li.innerHTML=`<b>${LET[k]}</b><span></span>`;li.querySelector('span').textContent=o;ul.appendChild(li)});
  $('st-ans').textContent=S.rev?'藏答案':'看答案';
  $('st-prev').disabled=S.i===0;$('st-next').disabled=S.i===st.qs.length-1;
}
function renderTeams(){
  const t=$('teams');t.innerHTML='';t.hidden=!st.teams;
  for(let k=0;k<st.teams;k++){const d=document.createElement('div');d.className='team';
    d.innerHTML=`<div class="nm">${TN[k]}</div><div class="sc">${S.score[k]}</div><div class="pm"><button aria-label="${TN[k]}減1分">−</button><button aria-label="${TN[k]}加1分">+</button></div>`;
    const [m,p]=d.querySelectorAll('button');
    m.onclick=()=>{S.score[k]=Math.max(0,S.score[k]-1);renderTeams()};
    p.onclick=()=>{S.score[k]++;renderTeams()};
    t.appendChild(d)}
}
function go(d){const n=S.i+d;if(n<0||n>=st.qs.length)return;S.i=n;S.rev=false;renderStage()}
$('play').onclick=()=>{if(!st.qs.length){toast('先出題喔');return}
  S.i=0;S.rev=false;S.score=[0,0,0,0];$('stage').hidden=false;document.body.style.overflow='hidden';renderStage();renderTeams()};
$('st-close').onclick=()=>{stopTimer();$('stage').hidden=true;document.body.style.overflow=''};
$('st-prev').onclick=()=>go(-1);$('st-next').onclick=()=>go(1);
$('st-ans').onclick=()=>{S.rev=!S.rev;$('st-q').classList.toggle('show-ans',S.rev);$('st-ans').textContent=S.rev?'藏答案':'看答案'};
$('timer').onclick=()=>{if(S.tm)return;S.sec=SECS[(SECS.indexOf(S.sec)+1)%SECS.length];setTimer()};
$('st-time').onclick=()=>{
  if(S.tm){stopTimer();setTimer();return}
  S.left=S.sec;setTimer();
  S.tm=setInterval(()=>{S.left--;setTimer();
    if(S.left<=5)$('timer').classList.add('low');
    if(S.left<=0){stopTimer();$('timer').textContent='0';$('timer').classList.add('low');toast('時間到!')}},1000);
};
document.addEventListener('keydown',e=>{
  if($('stage').hidden)return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '){e.preventDefault();$('st-ans').click()}else if(e.key==='Escape')$('st-close').click();
});

renderSetup();
</script>

</body></html>
