<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小小知識王</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面:手機單欄。一個網址、四個畫面:建立比賽 / 輸入暱稱 / 作答 / 排行榜。 */
:root{
  --bg:#EEF2FF; --card:#FFFFFF; --fg:#2B2A4C; --muted:#66658C; --line:#D9DEF7; --edge:#C9D0F2;
  --accent:#FF6B8B; --accent-dk:#D94A6B; --sun:#FFC93C; --mint:#2FBF8F; --bad:#F0566B;
  --ok-bg:#DDF7EC; --bad-bg:#FFE1E6; --chip:#EEF2FF; --gold:#FFC93C; --silver:#C4CBE0; --bronze:#E3A375;
  --f:'Huninn','PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171A33; --card:#232748; --fg:#F1F0FF; --muted:#AAA9D2; --line:#353A63; --edge:#0F1126;
  --accent:#FF7C98; --accent-dk:#C84766; --ok-bg:#15392F; --bad-bg:#43202F; --chip:#2F3460; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171A33; --card:#232748; --fg:#F1F0FF; --muted:#AAA9D2; --line:#353A63; --edge:#0F1126;
  --accent:#FF7C98; --accent-dk:#C84766; --ok-bg:#15392F; --bad-bg:#43202F; --chip:#2F3460; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;
  padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto}
section{display:flex;flex-direction:column;gap:16px}
h1,h2{font-weight:400;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--edge);min-width:0}
.card h2{font-size:1.2rem;margin-bottom:10px}
.sub{color:var(--muted);font-size:.9rem}
.lbl{font-size:.85rem;color:var(--muted);margin:12px 0 6px;letter-spacing:.05em}
.btn{min-height:52px;padding:10px 18px;border:0;border-radius:16px;cursor:pointer;background:var(--accent);color:#fff;
  font-size:1.15rem;box-shadow:0 4px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dk)}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--card);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--edge)}
.btn.big{width:100%;min-height:58px;font-size:1.3rem}
.btn.sm{min-height:44px;padding:6px 14px;font-size:1rem}
.hero{text-align:center;padding-top:8px}
.hero h1{font-size:2.4rem;color:var(--accent);letter-spacing:.06em;line-height:1.2}
.hero p{color:var(--muted);margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stp{display:flex;align-items:center;gap:10px}
.stp i{font-style:normal;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sun);color:#3B2F00;font-size:1rem;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:52px;padding:6px 18px;border-radius:99px;border:2px solid var(--line);background:var(--chip);cursor:pointer;font-size:1.1rem;box-shadow:0 3px 0 var(--edge);display:inline-flex;align-items:center;gap:8px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dk)}
.pick:disabled{opacity:.4;cursor:not-allowed}
.pick{min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--chip);cursor:pointer;font-size:1.1rem;box-shadow:0 3px 0 var(--edge)}
.pick:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.pick.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dk)}
.name{width:100%;min-height:56px;padding:6px 14px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:1.3rem;text-align:center}
.top{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.pill{background:var(--sun);color:#3B2F00;border-radius:99px;padding:2px 12px}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;width:0;background:var(--mint);border-radius:99px;transition:width .3s}
.q{font-size:1.4rem;line-height:1.5;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;text-align:left;cursor:pointer;
  border-radius:18px;border:3px solid var(--line);background:var(--card);font-size:1.1rem;box-shadow:0 4px 0 var(--edge)}
.opt:active:not(.lock){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt .ch{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt.lock{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--mint)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-radius:18px;padding:12px 14px;font-size:1.15rem}
.fb.ok{background:var(--ok-bg);border:2px solid var(--mint)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.me{text-align:center}
.me .big{font-size:3.4rem;line-height:1.1;color:var(--accent)}
.me .mer{font-size:1.4rem}
.board{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:2px dashed var(--line)}
.row:first-child{border-top:0}
.row.mine{background:var(--chip);border-radius:14px;border-top-color:transparent}
.rk{width:44px;text-align:center;flex:none;font-size:1.3rem;font-variant-numeric:tabular-nums}
.medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#3B2F00;margin:0 auto}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.15rem}
.row .sc{font-size:1.3rem;font-variant-numeric:tabular-nums}
.row .tm{color:var(--muted);font-size:.85rem;width:54px;text-align:right;font-variant-numeric:tabular-nums}

/* 前三名獎盃動畫 */
.trophy{display:inline-block;font-size:1.9rem;line-height:1;transform-origin:50% 90%;animation:tw 2.2s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.row.t1 .trophy{font-size:2.3rem;animation:tw 1.6s ease-in-out infinite,glow 1.6s ease-in-out infinite}
.row.t2 .trophy{animation-delay:.3s}.row.t3 .trophy{animation-delay:.6s}
@keyframes tw{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.12)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,200,0,0))}50%{filter:drop-shadow(0 0 9px rgba(255,190,0,.95))}}
.row.t1,.row.t2,.row.t3{border-radius:14px;border-top-color:transparent;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.row.t1{background:linear-gradient(90deg,#FFF3B8,#FFE066);font-weight:700}
.row.t2{background:linear-gradient(90deg,#F1F3F6,#D9DEE6)}
.row.t3{background:linear-gradient(90deg,#FFE6D2,#F0BE98)}
.row.t2{animation-delay:.12s}.row.t3{animation-delay:.24s}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.94)}100%{opacity:1;transform:none}}
.cheer{text-align:center;font-size:1.3rem;margin:8px 0;animation:pop .7s both}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.trophy,.row.t1,.row.t2,.row.t3,.cheer{animation:none!important}}
.qr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:12px;width:fit-content;margin:0 auto}
.qr svg,.qr img{display:block;width:min(60vw,240px);height:auto}
.link{word-break:break-all;background:var(--chip);border-radius:12px;padding:8px 12px;font-size:.9rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);text-align:center}
.bd .qr svg{width:min(40vh,300px)}
@media (min-width:900px){.app.wide{max-width:900px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 1. 建立比賽(主辦人) -->
  <section id="v-create" hidden>
    <div class="hero"><h1>小小知識王</h1><p>大家掃同一個 QR 碼,答一樣的題目,比出排行榜</p></div>
    <div class="card">
      <h2 class="stp"><i>1</i>選年級(可以多選)</h2>
      <div class="lbl" style="margin-top:0">小學</div><div class="grid3" id="gP"></div>
      <div class="lbl">國中</div><div class="grid3" id="gJ"></div>
    </div>
    <div class="card">
      <h2 class="stp"><i>2</i>選科目(可以多選)</h2>
      <div class="chips" id="gS" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2 class="stp"><i>3</i>題數</h2>
      <div class="grid4" id="gN" style="margin-top:12px"></div>
      <p class="sub" id="gH" style="margin-top:10px"></p>
    </div>
    <div class="card">
      <h2 class="stp"><i>4</i>開始方式</h2>
      <div class="seg2" id="gW" style="margin-top:12px"></div>
      <p class="sub" id="gWH" style="margin-top:10px"></p>
    </div>
    <button class="btn big" id="mk">建立比賽</button>
  </section>

  <!-- 2. 分享 QR(主辦人) -->
  <section id="v-share" hidden>
    <div class="hero"><h1 id="sh-t">比賽已建立</h1><p id="sh-s"></p></div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="qr" id="sh-qr"></div>
      <div class="link" id="sh-link"></div>
      <button class="btn ghost" id="sh-copy">複製連結</button>
    </div>
    <div class="card" id="sh-ctl" hidden>
      <h2>比賽控制</h2>
      <p class="sub" id="sh-st" style="margin-bottom:12px"></p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn big" id="sh-start" hidden>▶ 開始比賽</button>
        <button class="btn big ghost" id="sh-end" hidden>結束比賽</button>
        <button class="btn big ghost" id="sh-del">🗑 刪除這場比賽</button>
      </div>
    </div>
    <p class="sub" id="sh-ctlnote" style="text-align:center" hidden></p>
    <a class="btn big" id="sh-board" style="text-align:center;text-decoration:none;display:block;line-height:38px">開啟大螢幕排行榜</a>
    <button class="btn big ghost" id="sh-play">我也要玩</button>
    <button class="btn big ghost" id="sh-new">🔀 換一組題目</button>
    <p class="sub" id="sh-newn" style="text-align:center" hidden></p>
  </section>

  <!-- 3. 輸入暱稱 -->
  <section id="v-join" hidden>
    <div class="hero"><h1>準備好了嗎?</h1><p id="jn-s"></p></div>
    <div class="card">
      <h2>你的暱稱</h2>
      <input class="name" id="nick" maxlength="8" placeholder="最多 8 個字" autocomplete="off">
      <p class="sub" style="margin-top:8px">每個人的題目順序不同,答完會看到全班排行榜。</p>
    </div>
    <p class="sub" id="jn-wait" style="text-align:center" hidden></p>
    <button class="btn big" id="go">開始作答</button>
  </section>

  <!-- 4. 作答 -->
  <section id="v-play" hidden>
    <div>
      <div class="top"><span class="pill" id="pl-g"></span><span class="grow" id="pl-p"></span><span id="pl-n"></span></div>
      <div class="track"><i id="pl-bar"></i></div>
    </div>
    <div class="card"><div class="q" id="pl-q"></div></div>
    <div class="opts" id="pl-o"></div>
    <div class="fb" id="pl-fb" hidden aria-live="polite"></div>
    <button class="btn big" id="pl-next" hidden>下一題</button>
  </section>

  <!-- 5. 結果與排行榜 -->
  <section id="v-end" hidden>
    <div class="card me">
      <div class="sub" id="me-n"></div>
      <div class="big" id="me-s"></div>
      <div class="mer" id="me-r"></div>
      <p class="sub" id="me-t"></p>
    </div>
    <div class="card"><h2>排行榜</h2><div class="board" id="end-board"></div><p class="sub" id="end-note" style="margin-top:10px"></p></div>
    <button class="btn big ghost" id="end-refresh">更新排行榜</button>
  </section>

  <!-- 6. 大螢幕排行榜 -->
  <section id="v-board" class="bd" hidden>
    <div class="hero"><h1>排行榜</h1><p id="bd-s"></p></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div class="qr" id="bd-qr"></div><p class="sub">還沒作答的人,掃這個 QR 碼加入</p>
    </div>
    <div class="card"><div class="board" id="bd-list"></div></div>
  </section>

  <p class="err" id="err" hidden></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import { DB, GR, SUBJECTS, ALL, poolSize, pickQuestions, parseRoom } from "./questions.js";
import { firebaseConfig } from "./firebase-config.js";

/* ---------- Firebase Firestore(成績與排行榜都存在這裡)---------- */
let _fb;
function fb() {
  if (_fb) return _fb;
  const c = firebaseConfig;
  if (!c || !c.apiKey || /^YOUR|^$/.test(c.apiKey)) return (_fb = Promise.reject(new Error("no_config")));
  const B = "https://www.gstatic.com/firebasejs/10.14.1/";
  return (_fb = Promise.all([import(B + "firebase-app.js"), import(B + "firebase-firestore.js")])
    .then(([a, f]) => { const app = a.initializeApp(c); return { db: f.getFirestore(app), f, app, B }; }));
}
// 成績和狀態都帶一個「過期時間」,在 Firebase 設好 TTL 政策後,過期的資料會自動刪除(預設保留 30 天)。
const TTL_DAYS = 30;
const expireAt = (f) => f.Timestamp.fromMillis(Date.now() + TTL_DAYS * 86400000);
// 排序用單一數字:答對越多越大,同分時用時越短越大。這樣 Firestore 不用另外建索引。
async function submitScore(room, name, score, total, ms) {
  const { db, f } = await fb();
  const ctl = await readCtl(room).catch(() => null);
  if (ctl && ctl.status === "closed") throw new Error("closed");
  const key = score * 10000000 - Math.min(Math.round(ms / 10), 9999999);
  for (let i = 1; i <= 20; i++) {
    const final = i === 1 ? name : name.slice(0, 6) + i;
    try {
      await f.setDoc(f.doc(db, "rooms", room, "scores", final), { name: final, score, total, ms: Math.round(ms), key, at: Date.now(), expireAt: expireAt(f) });
      return final;
    } catch (e) { if (e.code !== "permission-denied") throw e; } // 名字已有人用,換一個再試
  }
  throw new Error("name_taken");
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LT = ["A", "B", "C", "D"];
const gname = (g) => (GR.find((x) => x[0] === g) || [])[1] || "";
const gnames = (gs) => (gs.length <= 3 ? gs.map(gname).join("、") : `${gs.length} 個年級`);
const show = (id) => { document.querySelectorAll("section").forEach((s) => (s.hidden = s.id !== "v-" + id)); $("#err").hidden = true; window.scrollTo(0, 0); };
const fail = (m) => { const e = $("#err"); e.textContent = m; e.hidden = false; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (ms) => (ms / 1000).toFixed(1) + "秒";

function qrSvg(text) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
}
const params = new URLSearchParams(location.search);
const room = params.get("r");
const base = location.origin + location.pathname;
const joinUrl = (r) => `${base}?r=${r}`;

/* ---------- 主辦人控制(狀態存在 rooms/<代碼>/ctl/state) ---------- */
// 狀態:open 掃碼就能作答、waiting 等主辦人開始、running 比賽中、closed 已結束(不再收成績)
async function myUid() {
  const { app, B } = await fb();
  const A = await import(B + "firebase-auth.js");
  const auth = A.getAuth(app);
  await auth.authStateReady();
  if (!auth.currentUser) await A.signInAnonymously(auth);
  return auth.currentUser.uid;
}
const ctlRef = (db, f, r) => f.doc(db, "rooms", r, "ctl", "state");
async function readCtl(r) { const { db, f } = await fb(); const s = await f.getDoc(ctlRef(db, f, r)); return s.exists() ? s.data() : null; }
async function watchCtl(r, cb) { const { db, f } = await fb(); return f.onSnapshot(ctlRef(db, f, r), (s) => cb(s.exists() ? s.data() : null), () => cb(null)); }
async function hostCreate(r, wait) { const { db, f } = await fb(); const uid = await myUid(); await f.setDoc(ctlRef(db, f, r), { owner: uid, status: wait ? "waiting" : "open", at: Date.now(), expireAt: expireAt(f) }); }
async function hostSet(r, status) { const { db, f } = await fb(); await f.updateDoc(ctlRef(db, f, r), { status, at: Date.now() }); }
// 刪除這場比賽:先刪所有成績,最後才刪狀態文件(規則要靠狀態文件確認你是主辦人)。每批 15 筆,避免超過規則的查詢次數上限。
async function hostDelete(r) {
  const { db, f } = await fb();
  const snap = await f.getDocs(f.collection(db, "rooms", r, "scores"));
  const refs = snap.docs.map((d) => d.ref);
  for (let i = 0; i < refs.length; i += 15) { const b = f.writeBatch(db); refs.slice(i, i + 15).forEach((x) => b.delete(x)); await b.commit(); }
  await f.deleteDoc(ctlRef(db, f, r));
}
let curRoom = null, hostWait = false, hostStop = null, endArm = false, endTimer = null;
const STATUS_TXT = {
  waiting: "等待開始:參賽者掃碼後會停在等待畫面,按「開始比賽」大家才能一起作答。",
  open: "進行中:掃碼的人可以直接作答。",
  running: "進行中:大家正在作答。",
  closed: "已結束:不再收新成績,排行榜已鎖定。",
};
async function hostBind(r, create) {
  if (hostStop) { hostStop(); hostStop = null; }
  const box = $("#sh-ctl"), note = $("#sh-ctlnote"); box.hidden = true; note.hidden = true;
  if (create !== undefined) hostWait = !!create;
  try {
    const uid = await myUid();
    if (create !== undefined) await hostCreate(r, create);
    const un = await watchCtl(r, (c) => {
      if (r !== curRoom) return;
      if (!c || c.owner !== uid) { box.hidden = true; return; }
      box.hidden = false;
      $("#sh-st").textContent = STATUS_TXT[c.status] || "";
      $("#sh-start").hidden = c.status !== "waiting";
      $("#sh-end").hidden = c.status === "closed";
    });
    hostStop = un;
  } catch (e) {
    if (create !== undefined && create) { note.textContent = "主辦人控制還不能用(Firebase 尚未開啟匿名登入)。這場比賽目前是「掃碼就開始」。"; note.hidden = false; }
  }
}
$("#sh-start").onclick = async () => { try { await hostSet(curRoom, "running"); } catch { fail("開始失敗,請檢查網路後再按一次。"); } };
$("#sh-end").onclick = async () => {
  const b = $("#sh-end");
  if (!endArm) { endArm = true; b.textContent = "再按一次確認結束"; clearTimeout(endTimer); endTimer = setTimeout(() => { endArm = false; b.textContent = "結束比賽"; }, 3000); return; }
  clearTimeout(endTimer); endArm = false; b.textContent = "結束比賽";
  try { await hostSet(curRoom, "closed"); } catch { fail("結束失敗,請檢查網路後再按一次。"); }
};
let delArm = false, delTimer = null;
$("#sh-del").onclick = async () => {
  const b = $("#sh-del");
  if (!delArm) { delArm = true; b.textContent = "再按一次:永久刪除所有成績"; clearTimeout(delTimer); delTimer = setTimeout(() => { delArm = false; b.textContent = "🗑 刪除這場比賽"; }, 4000); return; }
  clearTimeout(delTimer); delArm = false; b.disabled = true; b.textContent = "刪除中…";
  try {
    const r = curRoom; await hostDelete(r);
    if (hostStop) { hostStop(); hostStop = null; }
    store.set("done:" + r, null);
    history.replaceState(null, "", location.pathname); drawCreate(); show("create");
    fail("已刪除這場比賽的所有成績。");
  } catch { fail("刪除失敗,請確認你用的是建立比賽的同一個瀏覽器,再按一次。"); }
  b.disabled = false; b.textContent = "🗑 刪除這場比賽";
};

/* ---------- 建立比賽 ---------- */
const cfg = { wait: false, grades: new Set(["g3"]), n: 10, subj: new Set(ALL.split("")) };
const gradesArr = () => GR.map((x) => x[0]).filter((g) => cfg.grades.has(g));
const subjStr = () => ALL.split("").filter((c) => cfg.subj.has(c)).join("");
const sname = (s) => (s === ALL ? "全部科目" : SUBJECTS.filter(([c]) => s.includes(c)).map((x) => x[1]).join("、"));
function drawCreate() {
  const p = $("#gP"), j = $("#gJ"), n = $("#gN"), s = $("#gS"); p.innerHTML = j.innerHTML = n.innerHTML = s.innerHTML = "";
  GR.forEach(([g, t]) => { const b = document.createElement("button"); b.className = "pick" + (cfg.grades.has(g) ? " on" : ""); b.setAttribute("aria-pressed", cfg.grades.has(g)); b.textContent = t; b.onclick = () => { if (cfg.grades.has(g)) { if (cfg.grades.size > 1) cfg.grades.delete(g); } else cfg.grades.add(g); drawCreate(); }; (g[0] === "g" ? p : j).appendChild(b); });
  SUBJECTS.forEach(([c, t, e]) => {
    const b = document.createElement("button"); b.className = "chip" + (cfg.subj.has(c) ? " on" : ""); b.setAttribute("aria-pressed", cfg.subj.has(c));
    b.innerHTML = `<span aria-hidden="true">${e}</span>${t}`;
    b.onclick = () => { if (cfg.subj.has(c)) { if (cfg.subj.size > 1) cfg.subj.delete(c); } else cfg.subj.add(c); drawCreate(); };
    s.appendChild(b);
  });
  const pool = poolSize(gradesArr(), subjStr());
  const NS = [5, 10, 15, 20], opts = NS.filter((v) => v <= pool);
  if (pool < 5) opts.push(pool);
  if (pool > 12 || !opts.length) { /* 不會發生:每科至少 4 題 */ }
  if (!opts.includes(cfg.n)) cfg.n = opts.includes(10) ? 10 : opts[opts.length - 1];
  NS.concat(pool < 5 ? [pool] : []).forEach((v) => {
    const b = document.createElement("button"); b.className = "pick" + (cfg.n === v ? " on" : ""); b.textContent = v + " 題"; b.disabled = !opts.includes(v);
    b.onclick = () => { cfg.n = v; drawCreate(); }; n.appendChild(b);
  });
  const w = $("#gW"); w.innerHTML = "";
  [[false, "掃碼就開始"], [true, "等主辦人按開始"]].forEach(([v, t]) => { const b = document.createElement("button"); b.className = "pick" + (cfg.wait === v ? " on" : ""); b.textContent = t; b.onclick = () => { cfg.wait = v; drawCreate(); }; w.appendChild(b); });
  $("#gWH").textContent = cfg.wait ? "參賽者掃碼後會先停在等待畫面,你按「開始比賽」後大家才能一起作答。需要先在 Firebase 開啟匿名登入。" : "參賽者掃碼後可以馬上作答。你仍然可以按「結束比賽」鎖定排行榜。";
  $("#gH").textContent = `這些年級、這些科目共有 ${pool} 題可以抽。` + (pool < 20 ? "題數多的選項會自動停用。" : "");
}
function code() { const c = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
function shareView(r, create) {
  const info = parseRoom(r), url = joinUrl(r);
  curRoom = r; hostBind(r, create);
  $("#sh-t").textContent = "比賽已建立";
  $("#sh-s").textContent = `${gnames(info.grades)} · ${sname(info.subj)} · ${info.n} 題 · 代碼 ${r.split("-").pop().toUpperCase()}`;
  $("#sh-qr").innerHTML = qrSvg(url);
  $("#sh-link").textContent = url;
  $("#sh-board").href = `${base}?r=${r}&view=board`;
  $("#sh-board").target = "_blank";
  $("#sh-new").onclick = () => {
    const nr = newRoom(info.grades.join(""), info.n, info.subj);
    history.replaceState(null, "", `?host=1&r=${nr}`); shareView(nr, hostWait);
    const m = $("#sh-newn"); m.textContent = "已換成新的題目,舊的 QR 碼作廢,請用新的 QR 碼。排行榜也會重新計算。"; m.hidden = false;
  };
  $("#sh-newn").hidden = true;
  $("#sh-play").onclick = () => { history.replaceState(null, "", `?r=${r}`); joinView(r); };
  $("#sh-copy").onclick = async () => { try { await navigator.clipboard.writeText(url); $("#sh-copy").textContent = "已複製"; } catch { $("#sh-copy").textContent = "請長按上方連結複製"; } };
  show("share");
}
const newRoom = (grades, n, sj) => `${grades}-${n}-${sj === ALL ? "" : sj + "-"}${code()}`;
$("#mk").onclick = () => { const r = newRoom(gradesArr().join(""), cfg.n, subjStr()); history.replaceState(null, "", `?host=1&r=${r}`); shareView(r, cfg.wait); };

/* ---------- 加入與作答 ---------- */
function joinView(r) {
  const info = parseRoom(r);
  if (!info) { show("create"); fail("這個比賽連結不正確,請向主辦人再要一次 QR 碼。"); return; }
  const done = store.get("done:" + r);
  if (done) { endView(r, done); return; }
  $("#jn-s").textContent = `${gnames(info.grades)} · ${sname(info.subj)} · 共 ${info.n} 題`;
  $("#nick").value = store.get("nick") || "";
  stopAll();
  const goBtn = $("#go"), wn = $("#jn-wait");
  goBtn.disabled = false; wn.hidden = true;
  watchCtl(r, (c) => {
    const st = c && c.status, lock = st === "waiting" || st === "closed";
    goBtn.disabled = lock; wn.hidden = !lock;
    wn.textContent = st === "closed" ? "主辦人已經結束比賽,不能再作答了。" : "請等主辦人按「開始比賽」,按鈕亮起來就可以開始。";
  }).then((un) => stops.push(un)).catch(() => {});
  $("#go").onclick = () => { const n = $("#nick").value.replace(/[\/\s]+/g, " ").trim().slice(0, 8); if (!n) { $("#nick").focus(); return; } store.set("nick", n); play(r, n); };
  show("join");
}

let S;
function play(r, name) {
  const qs = shuffle(pickQuestions(r)).map((q) => ({ ...q, options: shuffle(q.options) }));
  S = { r, name, qs, i: 0, ms: 0, t0: 0, ans: [], right: 0, locked: false };
  $("#pl-g").textContent = gnames(parseRoom(r).grades);
  show("play"); showQ();
}
function showQ() {
  const q = S.qs[S.i]; S.locked = false;
  $("#pl-p").textContent = `第 ${S.i + 1} / ${S.qs.length} 題`;
  $("#pl-n").textContent = S.name;
  $("#pl-bar").style.width = (S.i / S.qs.length) * 100 + "%";
  $("#pl-q").textContent = q.q;
  const o = $("#pl-o"); o.innerHTML = "";
  q.options.forEach((t, k) => { const b = document.createElement("button"); b.className = "opt"; b.innerHTML = `<span class="ch">${LT[k]}</span><span class="tx">${esc(t)}</span>`; b.onclick = () => choose(k); o.appendChild(b); });
  $("#pl-fb").hidden = true; $("#pl-next").hidden = true;
  S.t0 = performance.now();
}
function choose(k) {
  if (S.locked) return; S.locked = true;
  S.ms += performance.now() - S.t0;
  const q = S.qs[S.i], pick = q.options[k], ok = pick === q.correct;
  S.ans.push({ id: q.id, a: pick }); if (ok) S.right++;
  document.querySelectorAll("#pl-o .opt").forEach((b, j) => { b.classList.add("lock"); if (q.options[j] === q.correct) b.classList.add("ok"); else if (j === k) b.classList.add("bad"); else b.classList.add("dim"); });
  const fb = $("#pl-fb"); fb.className = "fb " + (ok ? "ok" : "bad");
  fb.textContent = ok ? "答對了!" : "答錯了,正確答案是:" + q.correct; fb.hidden = false;
  const nx = $("#pl-next"); nx.textContent = S.i >= S.qs.length - 1 ? "送出成績" : "下一題"; nx.hidden = false; nx.disabled = false;
  nx.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
$("#pl-next").onclick = async () => {
  if (S.i < S.qs.length - 1) { S.i++; showQ(); window.scrollTo(0, 0); return; }
  const nx = $("#pl-next"); nx.disabled = true; nx.textContent = "送出中…";
  try {
    const total = S.qs.length, ms = Math.round(S.ms);
    const finalName = await submitScore(S.r, S.name, S.right, total, ms);
    const d = { name: finalName, score: S.right, total, ms };
    store.set("done:" + S.r, d); endView(S.r, d);
  } catch (e) { nx.disabled = false; nx.textContent = "送出失敗,再按一次"; fail(e.message === "no_config" ? "這個網站還沒連上 Firebase,請主辦人完成設定。" : e.message === "closed" ? "主辦人已經結束比賽,成績沒有送出。" : e.message === "name_taken" ? "這個名字已經有很多人用了,請回到上一頁換一個名字。" : "網路不穩或資料庫設定有問題,成績還沒送出。請再按一次「送出成績」。"); }
};

/* ---------- 排行榜 ---------- */
const TROPHY = ["", "🏆", "🥈", "🥉"];
function rows(list, me) {
  if (!list.length) return '<p class="sub" style="text-align:center;padding:12px">還沒有人完成作答</p>';
  return list.map((r) => {
    const top = r.rank <= 3;
    const m = top ? `<span class="trophy" title="第 ${r.rank} 名">${TROPHY[r.rank]}</span>` : r.rank;
    return `<div class="row${top ? " t" + r.rank : ""}${r.name === me ? " mine" : ""}"><span class="rk">${m}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span><span class="tm">${fmt(r.ms)}</span></div>`;
  }).join("");
}
// 彩帶:用一張畫布放幾秒就移除;使用者設定「減少動態效果」時不放。
function confetti(ms = 3200) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try {
    document.getElementById("confetti")?.remove();
    const c = document.createElement("canvas"); c.id = "confetti";
    c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
    const g = c.getContext("2d"), cols = ["#FFC400", "#FF6B8B", "#4DB6FF", "#6BD66B", "#B388FF", "#FF9A3C"];
    const ps = Array.from({ length: 110 }, () => ({
      x: c.width / 2 + (Math.random() - .5) * c.width * .3, y: c.height * .35,
      vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 3,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: cols[(Math.random() * cols.length) | 0],
    }));
    const t0 = performance.now();
    (function tick(t) {
      const k = t - t0; g.clearRect(0, 0, c.width, c.height);
      g.globalAlpha = Math.max(0, Math.min(1, (ms - k) / 700));
      for (const p of ps) { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }
      if (k < ms) requestAnimationFrame(tick); else c.remove();
    })(t0);
  } catch {}
}
// 即時監聽排行榜:只有成績有變動時才讀變動的那幾筆,不會每隔幾秒就重讀整份(免費額度每天只有 5 萬次讀取)。
async function watchBoard(r, lim, cb, onErr) {
  const { db, f } = await fb();
  const q = f.query(f.collection(db, "rooms", r, "scores"), f.orderBy("key", "desc"), f.limit(lim));
  return f.onSnapshot(q, (snap) => {
    const list = snap.docs.map((d) => { const o = d.data(); return { name: o.name, score: o.score, ms: o.ms }; });
    list.forEach((x, i) => { const p = list[i - 1]; x.rank = p && p.score === x.score && p.ms === x.ms ? p.rank : i + 1; });
    cb(list);
  }, onErr);
}
// 總人數:用 Firestore 的計數功能,每 1000 筆只算 1 次讀取,所以很省。
async function countBoard(r) {
  try { const { db, f } = await fb(); return (await f.getCountFromServer(f.collection(db, "rooms", r, "scores"))).data().count; } catch { return null; }
}
const stops = [];
function stopAll() { while (stops.length) { try { stops.pop()(); } catch {} } }
const boardErr = '<p class="sub" style="text-align:center">排行榜暫時讀不到,請檢查網路後重新整理頁面。</p>';
async function endView(r, d) {
  stopAll();
  $("#me-n").textContent = d.name;
  $("#me-s").textContent = `${d.score} / ${d.total}`;
  $("#me-t").textContent = `總共用時 ${fmt(d.ms)}`;
  $("#me-r").textContent = "";
  $("#end-note").textContent = "";
  $("#end-refresh").hidden = true; // 排行榜會自動更新,不需要手動按
  show("end");
  let total = null;
  const draw = (list) => {
    const mine = list.find((x) => x.name === d.name);
    $("#me-r").textContent = mine ? `目前第 ${mine.rank} 名` + (total ? `(共 ${total} 人)` : "") : (list.length >= 50 ? "目前在前 50 名之外" : "");
    $("#end-board").innerHTML = rows(list, d.name);
    const rk = mine ? mine.rank : 99;
    if (rk <= 3 && rk !== celebrated) { celebrated = rk; confetti(); }
    if (rk > 3) celebrated = 0;
    let ch = $("#me-cheer");
    if (!ch) { ch = document.createElement("div"); ch.id = "me-cheer"; ch.className = "cheer"; $("#me-r").after(ch); }
    ch.textContent = rk <= 3 ? `${TROPHY[rk]} 恭喜你進入前三名!` : "";
  };
  let celebrated = 0;
  let last = [];
  try {
    const un = await watchBoard(r, 50, (list) => { last = list; draw(list); }, () => { $("#end-board").innerHTML = boardErr; });
    stops.push(un);
    const upd = async () => { const c = await countBoard(r); if (c != null) { total = c; draw(last); } };
    upd(); const t = setInterval(upd, 30000); stops.push(() => clearInterval(t));
  } catch { $("#end-board").innerHTML = boardErr; }
}
async function boardView(r) {
  const info = parseRoom(r);
  if (!info) { show("create"); fail("這個比賽連結不正確。"); return; }
  stopAll();
  document.querySelector(".app").classList.add("wide");
  $("#bd-qr").innerHTML = qrSvg(joinUrl(r));
  const head = (n) => `${gnames(info.grades)} · ${sname(info.subj)} · ${info.n} 題` + (n == null ? ` · 代碼 ${r.split("-").pop().toUpperCase()}` : ` · 已完成 ${n} 人`);
  $("#bd-s").textContent = head(null);
  show("board");
  let total = 0, shown = 0, cst = null, champ;
  const hd = () => { $("#bd-s").textContent = head(Math.max(total, shown)) + (cst === "waiting" ? " · 等待開始" : cst === "closed" ? " · 已結束" : ""); };
  watchCtl(r, (c) => { cst = c && c.status; hd(); }).then((un) => stops.push(un)).catch(() => {});
  try {
    const un = await watchBoard(r, 20, (list) => {
      $("#bd-list").innerHTML = rows(list, null); shown = list.length; hd();
      const top = list[0] ? list[0].name : null;
      if (top && top !== champ) { if (champ !== undefined) confetti(); champ = top; }
    }, () => { $("#bd-list").innerHTML = boardErr; });
    stops.push(un);
    const upd = async () => { const c = await countBoard(r); if (c != null) { total = c; hd(); } };
    upd(); const t = setInterval(upd, 15000); stops.push(() => clearInterval(t));
  } catch { $("#bd-list").innerHTML = boardErr; }
}

/* ---------- 路由 ---------- */
if (!room) { drawCreate(); show("create"); }
else if (params.get("view") === "board") boardView(room);
else if (params.get("host") === "1") shareView(room);
else joinView(room);
</script>
