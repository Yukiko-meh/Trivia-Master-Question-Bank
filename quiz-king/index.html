<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小小知識王</title>
<style>html{color-scheme:light}[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&family=Huninn&display=swap">
<style>
/* Layout: 單欄手機優先,大按鈕、圓角、立體按壓感;三個畫面(首頁設定 / 答題 / 結果)切換 */
:root{
  --bg:#EEF2FF; --card:#FFFFFF; --fg:#2B2A4C; --muted:#66658C; --line:#D9DEF7; --edge:#C9D0F2;
  --accent:#FF6B8B; --accent-dk:#D94A6B; --sun:#FFC93C; --mint:#2FBF8F; --bad:#F0566B;
  --ok-bg:#DDF7EC; --bad-bg:#FFE1E6; --chip:#EEF2FF;
  --t1:#FF6B8B; --t2:#4C9AFF; --t3:#2FBF8F; --t4:#B07CFF;
  --f-display:'Huninn','Chiron GoRound TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --f-body:'Chiron GoRound TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171A33; --card:#232748; --fg:#F1F0FF; --muted:#AAA9D2; --line:#353A63; --edge:#0F1126;
    --accent:#FF7C98; --accent-dk:#C84766; --ok-bg:#15392F; --bad-bg:#43202F; --chip:#2F3460;
    --t1:#FF7C98; --t2:#6AAEFF; --t3:#3FD3A3; --t4:#C297FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171A33; --card:#232748; --fg:#F1F0FF; --muted:#AAA9D2; --line:#353A63; --edge:#0F1126;
  --accent:#FF7C98; --accent-dk:#C84766; --ok-bg:#15392F; --bad-bg:#43202F; --chip:#2F3460;
  --t1:#FF7C98; --t2:#6AAEFF; --t3:#3FD3A3; --t4:#C297FF; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:560px;margin:0 auto}
section{display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--edge);min-width:0}
.card h2{font-size:1.2rem;margin-bottom:10px}
.sub{color:var(--muted);font-size:.9rem}
.lbl{font-size:.85rem;color:var(--muted);margin:12px 0 6px;letter-spacing:.05em}

/* 按鈕 */
.btn{
  min-height:52px;padding:10px 18px;border:0;border-radius:16px;cursor:pointer;
  background:var(--accent);color:#fff;font-family:var(--f-display);font-size:1.15rem;
  box-shadow:0 4px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dk)}
.btn.ghost{background:var(--card);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--edge)}
.btn.ghost:active{box-shadow:0 1px 0 var(--edge)}
.btn.big{width:100%;min-height:58px;font-size:1.3rem}
.btn.sm{min-height:44px;padding:6px 14px;font-size:1rem}

/* 首頁 */
.hero{text-align:center;padding:8px 0 0}
.hero h1{font-size:2.4rem;color:var(--accent);letter-spacing:.06em;line-height:1.2}
.hero p{color:var(--muted);margin-top:4px}
.avs{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
.av{
  display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;
  background:var(--c,var(--accent));font-size:1.5rem;flex:none;
}
.avs .av{width:52px;height:52px;font-size:1.8rem;animation:hop 1.6s ease-in-out infinite}
.avs .av:nth-child(2){animation-delay:.15s}.avs .av:nth-child(3){animation-delay:.3s}.avs .av:nth-child(4){animation-delay:.45s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{
  min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--chip);cursor:pointer;
  font-family:var(--f-display);font-size:1.1rem;box-shadow:0 3px 0 var(--edge);
}
.pick:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.pick.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dk)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.trow{display:flex;align-items:center;gap:10px;margin-top:8px}
.trow input{
  flex:1;min-width:0;min-height:48px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);
  background:var(--bg);font-size:1.05rem;
}
.trow input:focus{border-color:var(--c)}

/* 比分晶片 */
.score{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.tm{
  min-width:0;padding:8px 4px 10px;border-radius:16px;text-align:center;background:var(--card);
  border:3px solid transparent;box-shadow:0 3px 0 var(--edge);position:relative;
}
.tm.cur{border-color:var(--c)}
.tm .av{width:38px;height:38px;font-size:1.3rem}
.tm .nm{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tm .pt{font-family:var(--f-display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tm .flag{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--c);color:#fff;
  font-size:.7rem;padding:1px 8px;border-radius:99px;white-space:nowrap;
}

/* 答題 */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.pill{display:inline-block;background:var(--sun);color:#3B2F00;border-radius:99px;padding:2px 12px;font-family:var(--f-display);font-size:.95rem}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;width:0;background:var(--mint);border-radius:99px;transition:width .3s}
.timer{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:#3B2F00;
  font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums;flex:none;
}
.timer.low{background:var(--bad);color:#fff;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.who{font-size:.95rem;color:var(--muted);margin-bottom:8px}
.teamrow{padding:12px 0;border-top:2px dashed var(--line)}
.card h2 + .teamrow{border-top:0;padding-top:4px}
.th{display:flex;align-items:center;gap:10px}
.th .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.st{font-size:.95rem;color:var(--muted);white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--fg);font-weight:700;padding:2px 12px;border-radius:99px}
.st.no{background:var(--bad-bg);color:var(--fg);font-weight:700;padding:2px 12px;border-radius:99px}
.lt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.lt .pick{min-height:52px;font-size:1.25rem;border-color:var(--c)}
.lt .pick:active{background:var(--c);color:#fff}
.q{font-family:var(--f-display);font-size:1.4rem;line-height:1.5;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;text-align:left;
  border-radius:18px;border:3px solid var(--line);background:var(--card);font-size:1.1rem;box-shadow:0 4px 0 var(--edge);
}
.opt:active:not(.lock){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt .ch{
  width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;
  font-family:var(--f-display);font-size:1rem;
}
.opt span.tx{min-width:0;overflow-wrap:anywhere}
.opt.lock{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--mint);animation:pop .35s}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.55}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:18px;padding:12px 14px;font-family:var(--f-display);font-size:1.15rem}
.fb.ok{background:var(--ok-bg);color:var(--fg);border:2px solid var(--mint)}
.fb.bad{background:var(--bad-bg);color:var(--fg);border:2px solid var(--bad)}

/* 調分面板 */
.sheet{position:fixed;inset:0;background:rgba(20,20,50,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{
  width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:85%;overflow-y:auto;
}
.panel h2{font-size:1.25rem;margin-bottom:4px}
.adj{display:flex;align-items:center;gap:10px;margin-top:12px}
.adj .info{flex:1;min-width:0}
.adj .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.adj .info span{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.adj .btn{width:52px;padding:0;font-size:1.5rem}

/* 結果 */
.win{text-align:center}
.win .trophy{font-size:3.2rem;animation:hop 1.6s ease-in-out infinite;display:inline-block}
.win h2{font-size:1.5rem;color:var(--accent);margin-top:4px;text-wrap:balance}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed var(--line)}
.rank:first-of-type{border-top:0}
.rank .md{width:40px;text-align:center;font-family:var(--f-display);font-size:1.6rem;flex:none}
.rank .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.cf{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="app">

  <!-- 首頁 -->
  <section id="home">
    <div class="hero">
      <div class="avs" aria-hidden="true">
        <span class="av" style="--c:var(--t1)">🐱</span><span class="av" style="--c:var(--t2)">🐶</span>
        <span class="av" style="--c:var(--t3)">🐰</span><span class="av" style="--c:var(--t4)">🐼</span>
      </div>
      <h1>小小知識王</h1>
      <p>小一到國三都能玩,各隊同時作答搶分!</p>
    </div>

    <div class="card">
      <h2>選年級</h2>
      <div class="lbl" style="margin-top:0">小學</div>
      <div class="grid3" id="gradeP"></div>
      <div class="lbl">國中</div>
      <div class="grid3" id="gradeJ"></div>
    </div>

    <div class="card">
      <h2>分隊伍</h2>
      <div class="seg" data-key="n" role="group" aria-label="隊伍數量">
        <button class="pick" data-v="2">2 隊</button><button class="pick" data-v="3">3 隊</button><button class="pick" data-v="4">4 隊</button>
      </div>
      <div id="teamBox"></div>
    </div>

    <div class="card">
      <h2>比賽設定</h2>
      <div class="lbl" style="margin-top:0">題數</div>
      <div class="seg" data-key="nQ" role="group" aria-label="題數">
        <button class="pick" data-v="5">5 題</button><button class="pick" data-v="10">10 題</button><button class="pick" data-v="12">12 題</button>
      </div>
      <div class="lbl">每題分數</div>
      <div class="seg" data-key="pts" role="group" aria-label="每題分數">
        <button class="pick" data-v="10">10 分</button><button class="pick" data-v="20">20 分</button>
      </div>
      <div class="lbl">倒數計時</div>
      <div class="seg" data-key="sec" role="group" aria-label="倒數計時">
        <button class="pick" data-v="0">不限</button><button class="pick" data-v="15">15 秒</button><button class="pick" data-v="30">30 秒</button>
      </div>
    </div>

    <button class="btn big" id="startBtn">開始比賽</button>
  </section>

  <!-- 答題 -->
  <section id="quiz" hidden>
    <div class="score" id="score"></div>
    <div>
      <div class="top">
        <span class="pill" id="gl"></span>
        <span class="grow disp" id="prog"></span>
        <div class="timer" id="timer" hidden>0</div>
        <button class="btn ghost sm" id="adjBtn">調分</button>
        <button class="btn ghost sm" id="endBtn">結束</button>
      </div>
      <div class="track"><i id="barFill"></i></div>
    </div>
    <div class="card">
      <div class="who">所有隊伍同時作答</div>
      <div class="q" id="qtext"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="card" id="panel"></div>
    <button class="btn big ghost" id="reveal">公布答案</button>
    <div class="fb" id="fb" hidden aria-live="polite"></div>
    <button class="btn big" id="next" hidden>下一題</button>
  </section>

  <!-- 結果 -->
  <section id="result" hidden>
    <div class="card win">
      <span class="trophy" aria-hidden="true">🏆</span>
      <h2 id="winTxt"></h2>
      <p class="sub" id="winSub"></p>
    </div>
    <div class="card" id="rankBox"></div>
    <div class="row2">
      <button class="btn" id="again">再玩一次</button>
      <button class="btn ghost" id="homeBtn">回首頁</button>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="調整比分">
    <h2>調整比分</h2>
    <p class="sub">裁判可以在這裡加分或扣分,每次增減一題的分數。</p>
    <div id="adjList"></div>
    <button class="btn big" id="closeSheet" style="margin-top:16px">完成</button>
  </div>
</div>
<div id="fx" aria-hidden="true"></div>

<script>
(function(){

};
var GR=[["g1","小一"],["g2","小二"],["g3","小三"],["g4","小四"],["g5","小五"],["g6","小六"],["j1","國一"],["j2","國二"],["j3","國三"]];
var AV=["🐱","🐶","🐰","🐼"], LT=["A","B","C","D"];
var S={grade:"g3",n:3,nQ:10,pts:10,sec:0,names:["","","",""],teams:[],list:[],i:0,cur:0,done:false,left:0,tid:null,endArm:false,endT:null};

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function glabel(g){for(var i=0;i<GR.length;i++)if(GR[i][0]===g)return GR[i][1];return ""}
function tname(i){return (S.teams[i]&&S.teams[i].name)||("第"+(i+1)+"隊")}
function show(id){["home","quiz","result"].forEach(function(k){$("#"+k).hidden=(k!==id)});window.scrollTo(0,0)}

/* 首頁 */
function renderGrades(){
  var p=$("#gradeP"),j=$("#gradeJ");p.innerHTML="";j.innerHTML="";
  GR.forEach(function(g){
    var b=document.createElement("button");b.className="pick"+(S.grade===g[0]?" on":"");b.textContent=g[1];b.dataset.g=g[0];
    (g[0].charAt(0)==="g"?p:j).appendChild(b);
  });
}
function renderTeams(){
  var box=$("#teamBox");box.innerHTML="";
  for(var i=0;i<S.n;i++){
    var r=document.createElement("div");r.className="trow";r.style.setProperty("--c","var(--t"+(i+1)+")");
    r.innerHTML='<span class="av">'+AV[i]+'</span><input id="team'+i+'" maxlength="8" placeholder="第'+(i+1)+'隊" value="'+esc(S.names[i])+'" aria-label="第'+(i+1)+'隊名稱">';
    box.appendChild(r);
  }
}
function markSegs(){
  document.querySelectorAll(".seg").forEach(function(sg){
    var k=sg.dataset.key;
    sg.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",+b.dataset.v===S[k])});
  });
}
$("#home").addEventListener("click",function(e){
  var g=e.target.closest("[data-g]");
  if(g){S.grade=g.dataset.g;renderGrades();return}
  var b=e.target.closest(".seg button");
  if(b){var k=b.parentNode.dataset.key;S[k]=+b.dataset.v;markSegs();if(k==="n")renderTeams()}
});
$("#teamBox").addEventListener("input",function(e){
  if(e.target.id&&e.target.id.indexOf("team")===0)S.names[+e.target.id.slice(4)]=e.target.value;
});

/* 開始 */
function start(){
  S.teams=[];
  for(var i=0;i<S.n;i++)S.teams.push({name:(S.names[i]||"").trim()||("第"+(i+1)+"隊"),score:0});
  var pool=shuffle(DB[S.grade].slice()).slice(0,S.nQ);
  S.list=pool.map(function(r){var o=shuffle(r.slice(1));return {q:r[0],opts:o,ans:o.indexOf(r[1])}});
  S.i=0;
  $("#gl").textContent=glabel(S.grade);
  show("quiz");showQ();
}
function renderScore(gain){
  var box=$("#score");box.style.setProperty("--n",S.n);box.innerHTML="";
  S.teams.forEach(function(t,i){
    var d=document.createElement("div");d.className="tm";
    d.style.setProperty("--c","var(--t"+(i+1)+")");
    d.setAttribute("aria-label",t.name+" "+t.score+" 分");
    var g=(gain&&gain[i])?'<span class="flag">+'+gain[i]+'</span>':"";
    d.innerHTML=g+'<span class="av">'+AV[i]+'</span><div class="nm">'+esc(t.name)+'</div><div class="pt">'+t.score+'</div>';
    box.appendChild(d);
  });
}
function renderPanel(){
  var q=S.list[S.i],box=$("#panel");box.innerHTML="";
  var h=document.createElement("h2");h.textContent=S.done?"各隊結果":"各隊作答";box.appendChild(h);
  S.teams.forEach(function(t,i){
    var p=S.picks[i],r=document.createElement("div");r.className="teamrow";r.style.setProperty("--c","var(--t"+(i+1)+")");
    var head='<div class="th"><span class="av">'+AV[i]+'</span><b class="nm">'+esc(t.name)+'</b>',body="";
    if(S.done){
      var ok=(p===q.ans);
      head+='<span class="st '+(ok?"ok":"no")+'">'+(p<0?"未作答":("選 "+LT[p]+(ok?" ✔ +"+S.pts:" ✘")))+'</span></div>';
    }else if(p>=0){
      head+='<span class="st">已作答 ✔</span><button class="btn ghost sm" data-redo="'+i+'">重選</button></div>';
    }else{
      head+='<span class="st">思考中…</span></div>';
      body='<div class="lt">'+LT.map(function(l,k){return '<button class="pick" data-t="'+i+'" data-k="'+k+'" aria-label="'+esc(t.name)+' 選 '+l+'">'+l+'</button>'}).join("")+'</div>';
    }
    r.innerHTML=head+body;box.appendChild(r);
  });
}
function updateReveal(){
  var all=S.picks.every(function(p){return p>=0});
  var b=$("#reveal");b.textContent=all?"全部作答完畢,公布答案":"公布答案";b.classList.toggle("ghost",!all);
}
$("#panel").addEventListener("click",function(e){
  if(S.done)return;
  var r=e.target.closest("[data-redo]");
  if(r){S.picks[+r.dataset.redo]=-1;renderPanel();updateReveal();return}
  var b=e.target.closest("[data-k]");if(!b)return;
  S.picks[+b.dataset.t]=+b.dataset.k;renderPanel();updateReveal();
});
$("#reveal").addEventListener("click",function(){reveal()});
function showQ(){
  var q=S.list[S.i];
  S.done=false;S.picks=S.teams.map(function(){return -1});
  $("#prog").textContent="第 "+(S.i+1)+" / "+S.list.length+" 題";
  $("#barFill").style.width=(S.i/S.list.length*100)+"%";
  $("#qtext").textContent=q.q;
  var o=$("#opts");o.innerHTML="";
  q.opts.forEach(function(t,k){
    var b=document.createElement("div");b.className="opt lock";b.dataset.k=k;
    b.innerHTML='<span class="ch">'+LT[k]+'</span><span class="tx">'+esc(t)+'</span>';
    o.appendChild(b);
  });
  $("#fb").hidden=true;$("#next").hidden=true;$("#reveal").hidden=false;
  renderScore();renderPanel();updateReveal();startTimer();
}
function startTimer(){
  clearInterval(S.tid);
  var t=$("#timer");
  if(!S.sec){t.hidden=true;return}
  t.hidden=false;S.left=S.sec;drawT();
  S.tid=setInterval(function(){
    S.left--;drawT();
    if(S.left<=0){clearInterval(S.tid);reveal()}
  },1000);
}
function drawT(){var t=$("#timer");t.textContent=Math.max(S.left,0);t.classList.toggle("low",S.left<=5)}

function reveal(){
  if(S.done)return;
  S.done=true;clearInterval(S.tid);
  var q=S.list[S.i],gain=[],winners=[];
  S.teams.forEach(function(t,i){
    if(S.picks[i]===q.ans){t.score+=S.pts;gain[i]=S.pts;winners.push(t.name)}
  });
  document.querySelectorAll("#opts .opt").forEach(function(b,j){b.classList.add(j===q.ans?"ok":"dim")});
  var fb=$("#fb");
  fb.className="fb "+(winners.length?"ok":"bad");
  fb.textContent="正確答案是 "+LT[q.ans]+"、"+q.opts[q.ans]+"。"+(winners.length?"答對的隊伍:"+winners.join("、"):"這題沒有隊伍答對");
  fb.hidden=false;$("#reveal").hidden=true;
  var nx=$("#next");nx.textContent=(S.i>=S.list.length-1)?"看結果":"下一題";nx.hidden=false;
  $("#barFill").style.width=((S.i+1)/S.list.length*100)+"%";
  renderScore(gain);renderPanel();
  fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
$("#next").addEventListener("click",function(){
  if(S.i>=S.list.length-1){finish();return}
  S.i++;showQ();window.scrollTo(0,0);
});

/* 結束(需按兩次確認) */
$("#endBtn").addEventListener("click",function(){
  var b=$("#endBtn");
  if(!S.endArm){
    S.endArm=true;b.textContent="再按結束";
    clearTimeout(S.endT);S.endT=setTimeout(function(){S.endArm=false;b.textContent="結束"},3000);
    return;
  }
  clearTimeout(S.endT);S.endArm=false;b.textContent="結束";finish();
});

/* 調分 */
function renderAdj(){
  var box=$("#adjList");box.innerHTML="";
  S.teams.forEach(function(t,i){
    var r=document.createElement("div");r.className="adj";r.style.setProperty("--c","var(--t"+(i+1)+")");
    r.innerHTML='<span class="av">'+AV[i]+'</span><div class="info"><b>'+esc(t.name)+'</b><span>'+t.score+' 分</span></div>'
      +'<button class="btn ghost" data-t="'+i+'" data-d="-1" aria-label="扣分">−</button>'
      +'<button class="btn" data-t="'+i+'" data-d="1" aria-label="加分">＋</button>';
    box.appendChild(r);
  });
}
$("#adjBtn").addEventListener("click",function(){renderAdj();$("#sheet").hidden=false});
$("#closeSheet").addEventListener("click",function(){$("#sheet").hidden=true;renderScore()});
$("#sheet").addEventListener("click",function(e){
  if(e.target.id==="sheet"){$("#sheet").hidden=true;renderScore();return}
  var b=e.target.closest("[data-d]");if(!b)return;
  S.teams[+b.dataset.t].score+=(+b.dataset.d)*S.pts;renderAdj();
});

/* 結果 */
function finish(){
  clearInterval(S.tid);
  var sc=S.teams.map(function(t,i){return {i:i,name:t.name,score:t.score}});
  sc.forEach(function(a){a.rank=1+sc.filter(function(b){return b.score>a.score}).length});
  sc.sort(function(a,b){return a.rank-b.rank||a.i-b.i});
  var tops=sc.filter(function(a){return a.rank===1});
  var allTie=tops.length===S.n;
  $("#winTxt").textContent=allTie?"平手!大家一樣強":tops.map(function(a){return a.name}).join("、")+" 獲勝!";
  $("#winSub").textContent=glabel(S.grade)+" · 共 "+S.list.length+" 題 · 每題 "+S.pts+" 分";
  var md=["🥇","🥈","🥉","4"],box=$("#rankBox");box.innerHTML="<h2>最後比分</h2>";
  sc.forEach(function(a){
    var r=document.createElement("div");r.className="rank";r.style.setProperty("--c","var(--t"+(a.i+1)+")");
    r.innerHTML='<span class="md">'+(a.rank<=3?md[a.rank-1]:a.rank)+'</span><span class="av">'+AV[a.i]+'</span><span class="nm">'+esc(a.name)+'</span><span class="sc">'+a.score+'</span>';
    box.appendChild(r);
  });
  show("result");
  if(!allTie||S.teams.some(function(t){return t.score>0}))confetti();
}
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var fx=$("#fx"),cols=["var(--t1)","var(--t2)","var(--t3)","var(--t4)","var(--sun)"];
  for(var i=0;i<36;i++){
    var c=document.createElement("i");c.className="cf";
    c.style.left=Math.random()*100+"%";c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*1.8)+"s";c.style.animationDelay=(Math.random()*.6)+"s";
    fx.appendChild(c);
  }
  setTimeout(function(){fx.innerHTML=""},4600);
}
$("#startBtn").addEventListener("click",start);
$("#again").addEventListener("click",start);
$("#homeBtn").addEventListener("click",function(){show("home")});

renderGrades();renderTeams();markSegs();
})();
</script>
